# Base template: BISV2 (Baseten Inference Stack v2) - Causal LLM, FP4 quantization (B200 only)
# Use for: dense + MoE models on Blackwell (B200). inference_stack v2 auto-manages most build
#          params; sequence/batch sizing lives under runtime.
# Varies per model: model_name, repo, max_seq_len / max_num_tokens
#
# quantization_type options:
#   fp4           — standard NVFP4 weight quantization
#   fp4_kv        — also quantizes the KV cache to FP4
#   fp4_mlp_only  — quantizes only the MLP layers; conservative, better quality
# For Qwen2-family models, add a quantization_config block with calib_size: 2048.
model_metadata:
  example_model_input:
    max_tokens: 512
    messages:
    - content: Tell me everything you know about optimized inference.
      role: user
    stream: true
    temperature: 0.5
  tags:
  - openai-compatible
model_name: BISV2-<org>-<model-name>-fp4-truss-example
python_version: py39
resources:
  accelerator: B200  # FP4 requires Blackwell (B200)
  cpu: '1'
  memory: 10Gi
  use_gpu: true
trt_llm:
  inference_stack: v2
  build:
    checkpoint_repository:
      repo: <org>/<model-name>
      revision: main
      source: HF
    quantization_type: fp4  # fp4 | fp4_kv | fp4_mlp_only
  runtime:
    max_batch_size: 32
    max_num_tokens: 32768   # = max_seq_len
    max_seq_len: 32768      # set to min(model.max_position_embeddings, 32768)
