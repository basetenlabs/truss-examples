# Base template: Briton - Causal LLM (decoder), no quantization
# Use for: Llama, Qwen, Mistral, Gemma text generation models
# Varies per model: model_name, accelerator, repo, max_seq_len (= model.max_position_embeddings),
#                   tensor_parallel_count (= number of GPUs)
model_metadata:
  example_model_input:
    max_tokens: 512
    messages:
    - content: Tell me everything you know about optimized inference.
      role: user
    stream: true
    temperature: 0.5
  tags:
  - openai-compatible
model_name: Briton-<org>-<model-name>-truss-example
python_version: py39
resources:
  accelerator: H100_40GB  # pick based on model size
  cpu: '1'
  memory: 10Gi
  use_gpu: true
trt_llm:
  build:
    base_model: decoder
    checkpoint_repository:
      repo: <org>/<model-name>
      revision: main
      source: HF
    max_seq_len: 131072      # set to model.max_position_embeddings
    quantization_type: no_quant
    tensor_parallel_count: 1  # set equal to number of GPUs
  runtime:
    enable_chunked_context: true
