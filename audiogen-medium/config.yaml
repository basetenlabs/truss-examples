description: AudioGen is a simple and controllable model for audio generation developed
  by Facebook AI Research.
environment_variables: {}
external_package_dirs: []
model_metadata:
  avatar_url: https://cdn.baseten.co/production/static/explore/meta.png
  cover_image_url: https://cdn.baseten.co/production/static/explore/musicgen-cover.png
  example_model_input:
    duration: 8
    prompts:
    - dog barking
    - sirene of an emergency vehicle
    - footsteps in a corridor
  tags:
  - text-to-audio
model_name: AudioGen medium
python_version: py39
requirements:
- torch>=2
- audiocraft==1.3.0
- transformers==4.35.0
- numpy<2
- torchaudio
resources:
  accelerator: A10G
  cpu: '3'
  memory: 14Gi
  use_gpu: true
secrets: {}
system_packages:
- ffmpeg
- pkg-config
- build-essential
- libavformat-dev
- libavcodec-dev
- libavdevice-dev
- libavutil-dev
- libavfilter-dev
- libswscale-dev
- libswresample-dev
