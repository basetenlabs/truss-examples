model_name: "model:nemotron-3.5-transcribe-30b-a4b preset:batch"

model_metadata:
  description: >-
    NVIDIA Nemotron-3.5-Transcribe-30B-A4B (BF16): a Speech-Augmented
    Language Model (hybrid Mamba-2/Transformer MoE decoder, ASR and Sortformer
    speaker encoders, CTC timestamp head). Offline/batch transcription on one
    RTX PRO 6000 with vLLM 0.32.0 and NeMo Speech's nemo_speechlm plugin,
    using NVIDIA's model-card serving flags: MTP speculative decoding
    (8 tokens), FP32 Mamba SSM cache, 65,536-token window (audio up to about
    1 hour per request).
  repo_id: nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B
  example_model_input:
    model: nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B
    messages:
      - role: user
        content:
          - type: text
            text: "Audio transcription. Language: as spoken. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
          - type: audio_url
            audio_url:
              url: https://raw.githubusercontent.com/ggerganov/whisper.cpp/b0a11594aec50892a02cd8d129eee2dfe93a8bb8/samples/jfk.wav
    max_tokens: 1024
    temperature: 0
    chat_template_kwargs:
      enable_thinking: false
  tags:
    - audio
    - transcription
    - speech-to-text
    - openai-compatible
    - vllm
    - nemo
    - nemotron
    - mtp
    - rtx-pro-6000

# A Baseten Training deployment replaces this mount with its merged checkpoint
# and repoints BASETEN_MODEL_PATH.
weights:
  - source: "hf://nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B@a188fff16c4f129a046788c2ad69e6198079a102"
    mount_location: "/app/checkpoint/model"

base_image:
  # vllm/vllm-openai:v0.32.0; supplies CUDA 13.0 and nvcc for JIT. Serving runs
  # from the venv built below (Python 3.12, from the .python-version file in
  # NeMo Speech a837f4e).
  image: "vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34"

system_packages:
  - git

# The model card's locked install: NeMo Speech main (a837f4e) synced with the
# asr and vllm extras (vLLM 0.32.0, Torch 2.13.0, FlashInfer 0.7.0.post1),
# Speech itself editable.
build_commands:
  # FlashInfer's MoE JIT on Blackwell needs nvrtc.h, which the image lacks.
  - apt-get update && apt-get install -y --no-install-recommends "cuda-nvrtc-dev-$(/usr/local/cuda/bin/nvcc --version | sed -n 's/.*release \([0-9]*\)\.\([0-9]*\).*/\1-\2/p')" && rm -rf /var/lib/apt/lists/*
  - pip install --no-cache-dir uv==0.13.1
  - git init -q /opt/nemo-speech/src && git -C /opt/nemo-speech/src fetch -q --depth 1 https://github.com/NVIDIA-NeMo/Speech.git a837f4e588ca778f46e586a8ad1acf5dc9a244a7 && git -C /opt/nemo-speech/src checkout -q FETCH_HEAD
  - uv venv --python 3.13 /opt/nemo-speech/venv
  # The base image sets UV_LINK_MODE=copy, UV_COMPILE_BYTECODE=1 and UV_OVERRIDE
  # (the vLLM pins) for its own install. Copy mode unpacks every wheel to /tmp
  # and copies it into the venv, about twice the venv size on disk, and the
  # build ran out of space (No space left on device, deploy qj7409j). Hardlink,
  # skip bytecode and drop the overrides for this venv.
  - env -u UV_OVERRIDE UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=0 UV_PROJECT_ENVIRONMENT=/opt/nemo-speech/venv uv sync --project /opt/nemo-speech/src --extra asr --extra vllm --no-install-project --locked --no-cache
  - env -u UV_OVERRIDE UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=0 uv pip install --python /opt/nemo-speech/venv/bin/python --no-deps --no-cache -e /opt/nemo-speech/src
  # Outside the lock: vLLM needs OpenCV (NeMo's uv policy suppresses it) and
  # PyAV (without it m4a/mp3 return HTTP 500).
  - env -u UV_OVERRIDE UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=0 uv pip install --python /opt/nemo-speech/venv/bin/python --no-deps --no-cache 'opencv-python-headless==5.0.0.93' 'av==19.0.2'
  # FlashInfer's prebuilt kernels for 0.7.0.post1 on CUDA 13.0: the flashinfer-jit-cache shim
  # plus only its sm120f provider (the shim's other providers are other GPU types). It covers
  # fused_moe_120 and sampling: batch engine init 749 s -> 400 s on a cold deploy (woogrev).
  - env -u UV_OVERRIDE UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=0 uv pip install --python /opt/nemo-speech/venv/bin/python --no-deps --no-cache 'https://github.com/flashinfer-ai/flashinfer/releases/download/v0.7.0.post1/flashinfer_jit_cache-0.7.0.post1+cu130-cp39-abi3-manylinux_2_28_x86_64.whl#sha256=9630eeb32396adb89ce8ffa8465fedd14549eb2e2ad3aff182d9e69be4a12075' 'https://github.com/flashinfer-ai/flashinfer/releases/download/v0.7.0.post1/flashinfer_jit_cache_sm120f-0.7.0.post1+cu130-cp39-abi3-manylinux_2_28_x86_64.whl#sha256=1c8b5a3614fdc9ad4f0e26502c5438657e28d667d165b05ff0383ca8d208568f'
  # Fail the build, not the first start, if FlashInfer would still JIT the MoE kernel.
  - FLASHINFER_CUDA_ARCH_LIST=12.0f /opt/nemo-speech/venv/bin/python -c "from flashinfer.jit.fused_moe import gen_cutlass_fused_moe_sm120_module as g; from flashinfer.jit.sampling import gen_sampling_module as s; assert g().is_aot and s().is_aot"
  # Startup study (RTX arm): no FlashInfer module is prebuilt into the image. Image-built sm120f
  # checkpointing_ssu/trtllm_utils saved ~55 s of cold start but raised batch c1 server p50 in all
  # three cold starts that used them (445/496/569 vs 302-373 ms; exec-43/44/50). FlashInfer JIT-builds
  # them on the first cold start (cached by the BDN startup cache), as on main.
  # Byte-compile the engine venv at build (startup study); errors are left to import time.
  # The engine venv is Python 3.12 here: uv sync follows NeMo a837f4e's .python-version and
  # replaces the 3.13 venv made above ("Removed virtual environment", q9opjyj build). Take
  # site-packages from the venv's own interpreter (the python3.13 path compiled nothing).
  - /opt/nemo-speech/venv/bin/python -m compileall -q -j 0 "$(/opt/nemo-speech/venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" /opt/nemo-speech/src > /tmp/compileall-venv.log 2>&1 || echo "compileall venv - some files left uncompiled, $(grep -c Error /tmp/compileall-venv.log) errors"
  # Fail the build unless the byte-compile actually wrote .pyc next to the engine's heaviest
  # imports (timestamp-checked, no SOURCE_DATE_EPOCH, so the runtime loads them as is).
  - /opt/nemo-speech/venv/bin/python -c "import importlib.util as u, pathlib, sys; import sysconfig; sp = pathlib.Path(sysconfig.get_paths()['purelib']); srcs = [sp / 'vllm/__init__.py', sp / 'torch/__init__.py', sp / 'flashinfer/__init__.py', sp / 'transformers/__init__.py', pathlib.Path('/opt/nemo-speech/src/nemo/__init__.py')]; missing = [str(s) for s in srcs if not pathlib.Path(u.cache_from_source(str(s))).exists()]; n = sum(1 for _ in sp.rglob('*.' + sys.implementation.cache_tag + '.pyc')); print('engine venv pyc files:', sp, n); assert not missing and n > 1000, ('compileall wrote no pyc for', missing, n)"

docker_server:
  # start.sh ignores the argument; it exposes the served model name to b10-bench.
  start_command: /bin/bash /app/data/start.sh --served-model-name nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000

resources:
  instance_type: RTX-PRO-6000

runtime:
  # Matches --max-num-seqs in start.sh (NEMOTRON_MAX_NUM_SEQS).
  predict_concurrency: 384
  streaming_read_timeout: 3600
  health_checks:
    # Cold engine init measured 400 / 418 s with the prebuilt FlashInfer kernels (749 s,
    # ~20 min of warmup, without them). The margin covers a slow weight mount.
    startup_threshold_seconds: 3000
    restart_threshold_seconds: 900
    stop_traffic_threshold_seconds: 120

environment_variables:
  # Checkpoint directory start.sh serves; Training overrides it.
  BASETEN_MODEL_PATH: "/app/checkpoint/model"
  VLLM_PLUGINS: "nemo_speechlm"
  # fork fails CUDA driver initialization.
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  # Model card: audio up to one hour per request.
  VLLM_MAX_AUDIO_DECODE_DURATION_S: "3600"
  # Not in the card: the 256 MiB default rejects 30-minute-plus 44.1 kHz stereo files.
  VLLM_MAX_AUDIO_DECODE_BYTES: "1610612736"
  # Not in the card: an hour-long audio_url can exceed the default fetch timeout.
  VLLM_AUDIO_FETCH_TIMEOUT: "120"
  # Model card: compressed uploads up to 180 MB (the default is 25 MB).
  VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: "180"
  # Model card: word timestamps (CTC middleware) need the V1 model runner.
  VLLM_USE_V2_MODEL_RUNNER: "0"
  # Startup levers (Model Scout startup study; defaults reproduce main except autotune reuse, on). See the start script.
  # NEMOTRON_FLASHINFER_AUTOTUNE: "0" passes --no-enable-flashinfer-autotune.
  # NEMOTRON_WEIGHT_PREFETCH: "early" reads the checkpoint into the page cache in parallel during
  #   imports (fails the start if it cannot fit or a read fails); "vllm" passes
  #   --safetensors-load-strategy prefetch; "off" is main's mmap load.
  NEMOTRON_FLASHINFER_AUTOTUNE: "1"
  NEMOTRON_WEIGHT_PREFETCH: "off"
  # NEMOTRON_AUTOTUNE_REUSE: "1" (default) skips FlashInfer tuning on a warm start for the ops in
  #   this deployment's own saved autotune file, only when it is the file vLLM loads for this
  #   exact config (same vLLM config hash, FlashInfer version and GPU name); serving reads the
  #   tuned tactics from it. Cold starts and mismatches tune as before. "0" opts out.
  # NEMOTRON_DIAG_RESTART_ONCE: "1" (diagnostic) starts vLLM twice in the container: boot 1 on a
  #   private port, stopped once healthy, then boot 2 on the served port with boot 1's local
  #   caches, so NEMOTRON_AUTOTUNE_REUSE is measured on a warm start. Ready only after boot 2.
  NEMOTRON_AUTOTUNE_REUSE: "1"
  NEMOTRON_DIAG_RESTART_ONCE: "0"
  # Scheduler limits passed to vLLM; overridable per /batch-bench variant. Keep
  # NEMOTRON_MAX_NUM_SEQS equal to runtime.predict_concurrency.
  NEMOTRON_MAX_NUM_BATCHED_TOKENS: "16384"
  NEMOTRON_MAX_NUM_SEQS: "384"
