model_name: "model:nemotron-3.5-transcribe-30b-a4b preset:rtx-pro-6000-batch-nvfp4"

model_metadata:
  description: >-
    NVIDIA Nemotron-3.5-Transcribe-30B-A4B (NVFP4) for offline/batch
    transcription on one RTX PRO 6000: a Speech-Augmented Language Model
    (hybrid Mamba-2/Transformer MoE decoder, ASR and Sortformer speaker
    encoders, CTC timestamp head), served with vLLM 0.32.0 and NeMo Speech's
    nemo_speechlm plugin. NVIDIA's NVFP4 checkpoint with an fp8 KV cache, MTP
    speculative decoding (8 tokens), audio-encoder CUDA graphs plus compile,
    a runaway-output guard, FP32 Mamba SSM cache and a 65,536-token window.
    Audio over 40 minutes is split server-side into 10-minute chunks, so one
    request takes up to 3 hours (1.5 GB) of audio.
  repo_id: nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B
  example_model_input:
    model: nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B
    messages:
      - role: user
        content:
          - type: text
            text: "Audio transcription. Language: as spoken. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
          - type: audio_url
            audio_url:
              url: https://raw.githubusercontent.com/ggerganov/whisper.cpp/b0a11594aec50892a02cd8d129eee2dfe93a8bb8/samples/jfk.wav
    max_tokens: 1024
    temperature: 0
    chat_template_kwargs:
      enable_thinking: false
  tags:
    - audio
    - transcription
    - speech-to-text
    - openai-compatible
    - vllm
    - nemo
    - nemotron
    - mtp
    - rtx-pro-6000
    - nvfp4

# A Baseten Training deployment replaces this mount with its merged checkpoint
# and repoints BASETEN_MODEL_PATH.
weights:
  # ModelOpt NVFP4 mixed-precision export (~22 GB, ungated, Blackwell only).
  - source: "hf://nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B-NVFP4@66c6adc4020179567074d0399cda2a4eeb2bb347"
    mount_location: "/app/checkpoint/nvfp4"

base_image:
  # vllm/vllm-openai:v0.32.0; supplies CUDA 13.0 and nvcc for JIT. Serving runs
  # from the venv built below (Python 3.12, from the .python-version file in
  # NeMo Speech a837f4e).
  image: "vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34"

system_packages:
  - git

# The model card's locked install: NeMo Speech main (a837f4e) synced with the
# asr and vllm extras (vLLM 0.32.0, Torch 2.13.0, FlashInfer 0.7.0.post1),
# Speech itself editable.
build_commands:
  # FlashInfer's MoE JIT on Blackwell needs nvrtc.h, which the image lacks.
  - apt-get update && apt-get install -y --no-install-recommends "cuda-nvrtc-dev-$(/usr/local/cuda/bin/nvcc --version | sed -n 's/.*release \([0-9]*\)\.\([0-9]*\).*/\1-\2/p')" && rm -rf /var/lib/apt/lists/*
  - pip install --no-cache-dir uv==0.13.1
  - git init -q /opt/nemo-speech/src && git -C /opt/nemo-speech/src fetch -q --depth 1 https://github.com/NVIDIA-NeMo/Speech.git a837f4e588ca778f46e586a8ad1acf5dc9a244a7 && git -C /opt/nemo-speech/src checkout -q FETCH_HEAD
  - uv venv --python 3.13 /opt/nemo-speech/venv
  # The base image sets UV_LINK_MODE=copy, UV_COMPILE_BYTECODE=1 and UV_OVERRIDE
  # (the vLLM pins) for its own install. Copy mode unpacks every wheel to /tmp
  # and copies it into the venv, about twice the venv size on disk, and the
  # build ran out of space (No space left on device, deploy qj7409j). Hardlink,
  # skip bytecode and drop the overrides for this venv.
  - env -u UV_OVERRIDE UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=0 UV_PROJECT_ENVIRONMENT=/opt/nemo-speech/venv uv sync --project /opt/nemo-speech/src --extra asr --extra vllm --no-install-project --locked --no-cache
  - env -u UV_OVERRIDE UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=0 uv pip install --python /opt/nemo-speech/venv/bin/python --no-deps --no-cache -e /opt/nemo-speech/src
  # Outside the lock: vLLM needs OpenCV (NeMo's uv policy suppresses it) and
  # PyAV (without it m4a/mp3 return HTTP 500).
  - env -u UV_OVERRIDE UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=0 uv pip install --python /opt/nemo-speech/venv/bin/python --no-deps --no-cache 'opencv-python-headless==5.0.0.93' 'av==19.0.2'
  # FlashInfer's prebuilt kernels for 0.7.0.post1 on CUDA 13.0: the flashinfer-jit-cache shim
  # plus only its sm120f provider (the shim's other providers are other GPU types). It covers
  # fused_moe_120 and sampling: batch engine init 749 s -> 400 s on a cold deploy (woogrev).
  - env -u UV_OVERRIDE UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=0 uv pip install --python /opt/nemo-speech/venv/bin/python --no-deps --no-cache 'https://github.com/flashinfer-ai/flashinfer/releases/download/v0.7.0.post1/flashinfer_jit_cache-0.7.0.post1+cu130-cp39-abi3-manylinux_2_28_x86_64.whl#sha256=9630eeb32396adb89ce8ffa8465fedd14549eb2e2ad3aff182d9e69be4a12075' 'https://github.com/flashinfer-ai/flashinfer/releases/download/v0.7.0.post1/flashinfer_jit_cache_sm120f-0.7.0.post1+cu130-cp39-abi3-manylinux_2_28_x86_64.whl#sha256=1c8b5a3614fdc9ad4f0e26502c5438657e28d667d165b05ff0383ca8d208568f'
  # Fail the build, not the first start, if FlashInfer would still JIT the MoE kernel.
  - FLASHINFER_CUDA_ARCH_LIST=12.0f /opt/nemo-speech/venv/bin/python -c "from flashinfer.jit.fused_moe import gen_cutlass_fused_moe_sm120_module as g; from flashinfer.jit.sampling import gen_sampling_module as s; assert g().is_aot and s().is_aot"

docker_server:
  # start.sh ignores the argument; it exposes the served model name to b10-bench.
  start_command: /bin/bash /app/data/start.sh --served-model-name nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000

resources:
  instance_type: RTX-PRO-6000

runtime:
  # Matches --max-num-seqs in start.sh (NEMOTRON_MAX_NUM_SEQS).
  predict_concurrency: 384
  streaming_read_timeout: 3600
  health_checks:
    # Cold engine init measured 400 / 418 s with the prebuilt FlashInfer kernels (749 s,
    # ~20 min of warmup, without them). The margin covers a slow weight mount.
    startup_threshold_seconds: 3000
    restart_threshold_seconds: 900
    stop_traffic_threshold_seconds: 120

environment_variables:
  # Checkpoint directory start.sh serves; Training overrides it. Default: the NVFP4 export.
  # A Training checkpoint (BF16) loads with these defaults; set NEMOTRON_KV_CACHE_DTYPE "auto"
  # to give it a BF16 KV cache.
  BASETEN_MODEL_PATH: "/app/checkpoint/nvfp4"
  VLLM_PLUGINS: "nemo_speechlm"
  # fork fails CUDA driver initialization.
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  # Model card: audio up to one hour per request.
  VLLM_MAX_AUDIO_DECODE_DURATION_S: "3600"
  # Not in the card: the 256 MiB default rejects 30-minute-plus 44.1 kHz stereo files.
  VLLM_MAX_AUDIO_DECODE_BYTES: "1610612736"
  # Not in the card: an hour-long audio_url can exceed the default fetch timeout.
  VLLM_AUDIO_FETCH_TIMEOUT: "120"
  # Model card: compressed uploads up to 180 MB (the default is 25 MB).
  VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: "180"
  # Model card: word timestamps (CTC middleware) need the V1 model runner.
  VLLM_USE_V2_MODEL_RUNNER: "0"
  # Scheduler limits passed to vLLM. Keep NEMOTRON_MAX_NUM_SEQS equal to
  # runtime.predict_concurrency. 65536 batched tokens OOMs at GPU memory 0.88.
  NEMOTRON_MAX_NUM_BATCHED_TOKENS: "32768"
  NEMOTRON_MAX_NUM_SEQS: "384"
  # Knobs read by start.sh (start.sh's fallbacks match these values):
  # NEMOTRON_KV_CACHE_DTYPE: --kv-cache-dtype; the NVFP4 card needs "fp8".
  # NEMOTRON_GPU_MEMORY_UTILIZATION: --gpu-memory-utilization; NVFP4 MTP8 OOMs in the rejection
  #   sampler at 256 concurrent short clips with 0.94.
  NEMOTRON_KV_CACHE_DTYPE: "fp8"
  NEMOTRON_GPU_MEMORY_UTILIZATION: "0.88"
  # Server-side long-audio chunking (data/chunk_proxy.py, README "Long audio"), ported from
  # the H100 batch preset (#1195, 87626ae). On by default: 600 s chunks for audio over 2400 s.
  # "0" turns it off: vLLM serves :8000 directly (unless the guard is on). Set
  # NEMOTRON_CHUNK_MAX_SECONDS (longest chunk, >= 30) and NEMOTRON_CHUNK_TRIGGER_SECONDS
  # (only longer audio is chunked); e.g. "600"/"600" for 10-minute chunks. Needs
  # MAX <= TRIGGER <= VLLM_MAX_AUDIO_DECODE_DURATION_S; the proxy's --check refuses otherwise.
  NEMOTRON_CHUNK_MAX_SECONDS: "600"
  NEMOTRON_CHUNK_TRIGGER_SECONDS: "2400"
  # Each chunk after the first starts this long before the previous cut (stitch overlap).
  NEMOTRON_CHUNK_OVERLAP_SECONDS: "5"
  # How far before a chunk's limit the cut may move to land in a pause.
  NEMOTRON_CHUNK_SEARCH_SECONDS: "30"
  # Front-door limits per request when chunking is on: decoded duration and file size.
  NEMOTRON_MAX_AUDIO_SECONDS: "10800"
  NEMOTRON_MAX_AUDIO_MB: "1536"
  # Worker processes that decode long files into chunks (CPU; 2 queued 1-hr files at c32).
  NEMOTRON_CHUNK_DECODE_WORKERS: "8"
  # Runaway guard (data/runaway.py, README "Runaway guard"), ported from #1195 (054fc0e).
  # On by default; "0" turns it off. "1" runs the proxy in front of vLLM even with chunking off: each engine request's max_tokens is
  # capped at ceil(audio_s x TOKENS_PER_S) + MARGIN_TOKENS (never above the client's); a unit
  # (file or chunk) that hits that cap, runs over 8 words/s (or 2.5x the request's median)
  # or loops is retried once as two halves when at least SPLIT_MIN_SECONDS (unchunked) or
  # CHUNK_SPLIT_MIN_SECONDS (a chunk) long; still anomalous gets NVIDIA's model-card loop
  # cleanup and finish_reason "length". Thinking requests are not guarded.
  NEMOTRON_RUNAWAY_GUARD: "1"
  NEMOTRON_RUNAWAY_TOKENS_PER_S: "8"
  NEMOTRON_RUNAWAY_MARGIN_TOKENS: "256"
  NEMOTRON_RUNAWAY_SPLIT_MIN_SECONDS: "600"
  NEMOTRON_RUNAWAY_CHUNK_SPLIT_MIN_SECONDS: "60"
  # vLLM frontend processes (--api-server-count). "1" passes no flag (argv unchanged). N > 1
  # spreads HTTP, audio decode and the NeMo processor / CTC middleware over N processes on
  # one engine core; each process imports NeMo, so host RAM grows per process.
  NEMOTRON_API_SERVER_COUNT: "4"
  # Audio-encoder CUDA graphs (NeMo Speech's opt-in EncoderGraphRunner, passed as
  # --hf-overrides encoder_cuda_graphs): 1 replays the ParallelExpertEncoder forward, long-audio
  # windows and Sortformer steps from CUDA graphs captured at the first encoder call.
  # NEMOTRON_ENCODER_COMPILE=1 (needs graphs) also torch.compiles each encoder block
  # (encoder_compile; bf16-rounding-level numerics change) and forces FlexAttention's main Triton
  # kernel in the encoder (data/encoder_flex.py). Both 0: no --hf-overrides flag.
  NEMOTRON_ENCODER_CUDA_GRAPHS: "1"
  NEMOTRON_ENCODER_COMPILE: "1"
  # Opt-in (off by default): the chunk proxy retries the audio-URL fetch and each engine POST
  # once on a dropped connection, answers a failed fetch with 502 instead of 400, and drops idle
  # pooled connections after 4 s (vLLM closes them after 5 s). It removes the ServerDisconnected
  # HTTP 400s on audio-URL fetches. Needs the proxy (chunking or the guard on).
  NEMOTRON_PROXY_RETRY: "0"
  # The proxy logs at INFO (startup config only); set NEMOTRON_LOG_LEVEL "DEBUG" for its
  # per-request diagnostics (sizes, counts and timings, never request or transcript content).
  # FlashInfer's FP8 scaled-mm kernel is disabled for the ModelOpt exports (FP8/NVFP4), and
  # encoder compile adds ~75 s to engine init, past vLLM's 600 s default on a cold start.
  VLLM_DISABLED_KERNELS: "FlashInferFP8ScaledMMLinearKernel"
  VLLM_ENGINE_READY_TIMEOUT_S: "1800"
