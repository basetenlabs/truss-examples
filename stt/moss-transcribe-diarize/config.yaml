model_name: moss-transcribe-diarize
model_metadata:
  repo_id: OpenMOSS-Team/MOSS-Transcribe-Diarize
  tags:
    - openai-compatible
    - audio
    - asr
    - diarization
secrets:
  hf_access_token: null
weights:
  - source: "hf://OpenMOSS-Team/MOSS-Transcribe-Diarize@main"
    mount_location: "/app/checkpoint/model"
    auth_secret_name: "hf_access_token"
environment_variables:
  HF_HOME: /app/models/huggingface
  TORCHINDUCTOR_CACHE_DIR: /app/models/inductor
  TRITON_CACHE_DIR: /app/models/triton
base_image:
  # CUDA 13 image recommended by the SGLang Omni installation guide.
  image: "lmsysorg/sglang-omni:dev@sha256:46235435997d1fa93fc81fb1c2d5b7fd8470d77395a5c348c0176094ffddf95e"
build_commands:
  # Pin the source because the upstream container only provides prerequisites.
  - git clone https://github.com/sgl-project/sglang-omni.git /opt/sglang-omni
  - cd /opt/sglang-omni && git checkout f7f81c265a088329c853935336930a0205d4cf89
  - uv venv /opt/sglang-omni/.venv --python 3.12
  - cd /opt/sglang-omni && uv pip install --python /opt/sglang-omni/.venv/bin/python -v .
docker_server:
  start_command: >-
    /opt/sglang-omni/.venv/bin/sgl-omni serve
    --model-path /app/checkpoint/model
    --port 8000
    --max-running-requests 16
    --cuda-graph-max-bs 16
    --mem-fraction-static 0.80
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/audio/transcriptions
  server_port: 8000
resources:
  accelerator: H100
  cpu: "8"
  memory: 32Gi
  use_gpu: true
runtime:
  predict_concurrency: 128
