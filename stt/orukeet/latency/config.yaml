# yaml-language-server: $schema=https://raw.githubusercontent.com/basetenlabs/truss/main/truss/config.schema.json

model_name: "model:orukeet preset:latency"
python_version: py310

model_metadata:
  repo_id: oruk/orukeet
  example_model_input: {"audio_url": "https://dldata-public.s3.us-east-2.amazonaws.com/2086-149220-0033.wav"}
  tags:
    - audio-to-text
    - speech-to-text
    - multilingual
    - timestamps


# Carried over unchanged from stt/parakeet-tdt-0.6b-v3/latency. Orukeet keeps
# Parakeet v3's 627M-parameter architecture, tokenizer and TDT decoder, so the
# batching, warmup and CUDA-graph settings tuned there apply here too. They are
# starting points for this checkpoint, not measured results.
environment_variables:
  MAX_BATCH_SIZE: "16"
  BATCH_WINDOW_MS: "5"
  BATCH_BUCKET_SECONDS: "2,4,8"
  PREDICT_TIMEOUT_SECONDS: "300"
  PARAKEET_DIRECT_FORWARD: "true"
  REQUIRE_FULL_CUDA_GRAPH: "true"
  WARMUP_AUDIO_SECONDS: "0.15,0.4,0.85,1.6,3.2,6"
  WARMUP_BATCH_SIZE: "2"
  FREEZE_GC_AFTER_WARMUP: "true"
  # Long-form audio (see model/model.py and README). Clips up to 24 min use the
  # full-attention model above; longer clips, up to the 3 hr cap, use a second copy
  # of the checkpoint switched to local attention with a [256, 256] context, the
  # parakeet-tdt-0.6b-v3 model card's long-form settings. load() proves both limits
  # fit on this GPU before the replica reports ready.
  # MAX_AUDIO_SECONDS equal to FULL_ATTENTION_MAX_SECONDS: short-only, no second copy.
  FULL_ATTENTION_MAX_SECONDS: "1440"
  MAX_AUDIO_SECONDS: "10800"
  LOCAL_ATTENTION_CONTEXT_SIZE: "256,256"
  SUBSAMPLING_CONV_CHUNKING_FACTOR: "1"
  LONG_AUDIO_STARTUP_CHECK: "true"
  MAX_AUDIO_INPUT_BYTES: "1073741824"

# Weights are pre-fetched and mounted, so the server never downloads from HF at
# request time. Revision 555136b is the commit the model card pins for the NeMo
# checkpoint; its orukeet-v0.1.0.nemo is byte-identical (sha256 031c8dda...) to
# the one on the repo's current main. The GGUF exports live at the same revision
# and are not used by this runtime, so they are left out of the mount.
weights:
  - source: "hf://oruk/orukeet@555136b50265a132d4cea0d35560c26fc4f657ab"
    mount_location: "/models/orukeet"
    ignore_patterns:
      - "*.gguf"

requirements:
  # The model card specifies nemo_toolkit[asr]==3.0.0 for this checkpoint, which
  # requires torch>=2.6.0 and, for CUDA 12, cuda-python>=12,<13. The RTX PRO 6000 is
  # a Blackwell GPU (sm_120); the torch 2.6.0 wheels the v3 package pins are built
  # for CUDA 12.4, which has no sm_120 kernels. torch 2.8.0's PyPI wheels are the
  # CUDA 12.8 build (nvidia-cuda-runtime-cu12==12.8.90, cuDNN 9.10), the first
  # CUDA line with Blackwell support.
  - torch==2.8.0
  - torchaudio==2.8.0
  - nemo_toolkit[asr]==3.0.0
  - cuda-python>=12.8,<13
  - httpx==0.28.1
  - soundfile==0.13.1

resources:
  # RTX PRO 6000 (96 GiB, 16 vCPU, 116 GiB host RAM) is the default on the runtime
  # owner's call. The v3 package's T4 (14.74 GiB) cannot hold a 24 min
  # full-attention pass: one hour needed a single 60.33 GiB allocation there.
  # Batching and warmup are still the T4 values; retuning them for 96 GiB is a
  # separate step.
  instance_type: RTX-PRO-6000

system_packages:
  - ffmpeg
  - libsndfile1

runtime:
  # 128 on the runtime owner's call (up from the v3 package's 8). NeMo's
  # ASRModel.transcribe() is not thread-safe, so one worker thread still owns
  # the mutable decoder state; this cap bounds admitted in-flight work, which
  # waits in the batcher's queue with its decoded waveform in host RAM.
  predict_concurrency: 128
  health_checks:
    # is_healthy() turns False only when the CUDA context can no longer run a
    # kernel or the GPU worker thread has died, neither of which recovers without a
    # restart, so act on it quickly instead of the 30 min platform default.
    stop_traffic_threshold_seconds: 30
    restart_threshold_seconds: 60
