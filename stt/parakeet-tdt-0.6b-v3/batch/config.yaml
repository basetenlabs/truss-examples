# yaml-language-server: $schema=https://raw.githubusercontent.com/basetenlabs/truss/main/truss/config.schema.json

model_name: "model:parakeet-tdt-0.6b-v3 preset:latency"
python_version: py310

model_metadata:
  repo_id: nvidia/parakeet-tdt-0.6b-v3
  example_model_input: {"audio_url": "https://dldata-public.s3.us-east-2.amazonaws.com/2086-149220-0033.wav"}
  tags:
    - audio-to-text
    - speech-to-text
    - multilingual
    - timestamps


# These defaults are tuned for short-form traffic on one GPU. The direct path
# removes NeMo's per-call DataLoader setup, while a small duration-aware batch
# raises utilization without padding short clips to an unrelated long clip.
environment_variables:
  MAX_BATCH_SIZE: "16"
  BATCH_WINDOW_MS: "5"
  BATCH_BUCKET_SECONDS: "2,4,8"
  PREDICT_TIMEOUT_SECONDS: "300"
  PARAKEET_DIRECT_FORWARD: "true"
  REQUIRE_FULL_CUDA_GRAPH: "true"
  WARMUP_AUDIO_SECONDS: "0.15,0.4,0.85,1.6,3.2,6"
  WARMUP_BATCH_SIZE: "2"
  FREEZE_GC_AFTER_WARMUP: "true"
  # Model Scout round 2 winners on RTX PRO 6000 (#865, run 39667523725). cuDNN off
  # tripled throughput at c=64 (49.9 vs 16.1 req/s). Full bfloat16 (model weights
  # cast once, no autocast) matched fp16 autocast on throughput and WER with a lower
  # encoder time (17.8 vs 22.6 ms at c=1).
  ENCODER_CUDNN: "false"
  PRECISION_MODE: "full"
  INFERENCE_DTYPE: "bfloat16"
  # Model Scout round 3 winner on RTX PRO 6000 (#865, run 39678817538). Length
  # bucketing lifted c=64 throughput from 45.96 to 53.79 req/s and cut server p50
  # from 86 to 75 ms (c=32: 31.52 -> 32.07 req/s, 65 -> 55 ms); c=1/8 tied and WER
  # was identical (20.82% / 3.20%).
  BATCH_LENGTH_BUCKETING: "true"
  # Model Scout round 7 on RTX PRO 6000 (#865, run 39733446532, same cluster,
  # 60 s timed cells): ending the 5 ms batch window once the queue is empty and
  # no predict() call is still decoding lifted c=64 throughput 6.0% over the mean
  # of two identical shipped arms (1,760.5 vs 1,658.8 / 1,661.9 audio-s per
  # wall-s, which agreed within 0.2%) and cut server p50 at c=1 to 26 ms (29-31)
  # and at c=64 to 112 ms (123-127). WER matched: 20.87% / 3.17% vs
  # 20.85-20.90% / 3.17-3.20%.
  BATCH_WINDOW_EARLY_EXIT: "true"
  # Encoder CUDA graphs (ported from stt/orukeet/batch-short, #604). Model Scout
  # round 4 on RTX PRO 6000 (#865, run 39701075887, same cluster): graphs cut
  # server p50 from 42 to 30 ms at c=1 and 86 to 51 ms at c=32, with throughput
  # within noise and WER 3.20% / 20.90% vs 3.20% / 20.70%. Batch sizes 1-16 x 1 s
  # length steps up to 30 s; longer inputs and larger batches run eagerly.
  ENCODER_CUDA_GRAPHS: "true"
  # Model Scout round 9 on RTX PRO 6000 (#865, run 39750926774, both arms on the
  # same cluster, c=64 90 s timed cells): capturing even batch sizes so a 9-15
  # clip batch no longer pads to 16 rows cut the encoder median at matched batch
  # sizes by 28-43% for 5-6 and 9-12 clip batches (batch 9: 50.7 -> 32.8 ms) and
  # server p50 from 48 to 42 ms. Throughput tied (1,010 vs 1,001 audio-s per
  # wall-s, client-path bound) and WER matched (20.87% / 3.17% vs 20.90% /
  # 3.17%). 270 graphs instead of 150: capture 56-74 s vs 34-57 s, peak
  # allocated GPU memory unchanged at 3.25 GiB (rounds 8-9 pod logs).
  ENCODER_GRAPH_BATCH_SIZES: "1,2,4,6,8,10,12,14,16"
  ENCODER_GRAPH_MAX_SECONDS: "30"
  ENCODER_GRAPH_STEP_SECONDS: "1"
  # Decode batch N on a second CUDA stream while batch N+1's encoder graph
  # replays (#926, see model/model.py). Model Scout round 11 (run 39767116873,
  # same cluster, aws-uw2) lifted audio xRT 11.4%; round 13 (run 39777023292,
  # same cluster, cor-ue13a) lifted it 6.4%, client-path bound. WER flat in
  # both; the startup serial-vs-pipeline transcript parity check passes.
  PIPELINE_OVERLAP: "true"

# Weights are pre-fetched and mounted, so the server never downloads from HF at
# request time. The .nemo checkpoint in the repo is what model/model.py loads.
weights:
  - source: "hf://nvidia/parakeet-tdt-0.6b-v3@541d1f99c6b0c3cd0b11a95167540bb8edefd82b"
    mount_location: "/models/parakeet-tdt-0.6b-v3"

requirements:
  # The RTX PRO 6000 is a Blackwell GPU (sm_120). torch 2.6.0's PyPI wheels are
  # the CUDA 12.4 build, which has no sm_120 kernels; torch 2.8.0's are the CUDA
  # 12.8 build (nvidia-cuda-runtime-cu12==12.8.90, cuDNN 9.10), the first CUDA
  # line with Blackwell support. NeMo 3.0.0 requires torch>=2.6.0 and, for
  # CUDA 12, cuda-python>=12,<13. These pins match stt/orukeet/batch, which
  # serves the same FastConformer-TDT architecture on this GPU.
  - torch==2.8.0
  - torchaudio==2.8.0
  - nemo_toolkit[asr]==3.0.0
  - cuda-python>=12.8,<13
  - httpx==0.28.1
  - soundfile==0.13.1

resources:
  # RTX PRO 6000 (96 GiB, Blackwell). Concurrency and batching were retuned on this
  # GPU (rounds 1, 3, 7 and 9 below); only the warmup shapes are still the T4 values.
  # The earlier T4 deployment stays listed as baseten/parakeet-tdt-0-6b-v3-t4.
  instance_type: RTX-PRO-6000

system_packages:
  - ffmpeg
  - libsndfile1

runtime:
  # Model Scout round 1 on RTX PRO 6000 (#865, run 39657501848): raising
  # predict_concurrency from 8 to 64 with MAX_BATCH_SIZE 16 lifted throughput at
  # c=32/64 from 6.84/7.41 to 10.96/18.21 req/s and cut server p50 from
  # 3359/6167 to 1595/1896 ms, with c=1/8 unchanged. MAX_BATCH_SIZE 32 or 64 did
  # not beat 16. One worker thread still owns the mutable NeMo decoder state, so
  # extra admitted requests queue for the batcher, not for parallel decoding.
  predict_concurrency: 128
