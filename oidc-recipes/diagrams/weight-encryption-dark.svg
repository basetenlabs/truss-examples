<rect class="bp0" x="38" y="21" width="383.1" height="18"/>
<text class="blbl-op mono" x="42" y="34">PHASE 1 — SETUP · you run this once, by hand</text>
<rect class="bp1" x="829.6" y="439" width="170.8" height="15"/>
<text class="zlbl mono" x="996.4" y="450" text-anchor="end">CUSTOMER AWS ACCOUNT</text>
<text class="eye mono" x="58" y="102">OPERATOR</text>
<text class="bnum-op mono" x="74" y="132" text-anchor="middle">1</text>
<text class="ctit" x="102" y="131">Create the KEK</text>
<text class="cbod" x="58" y="164">Customer-managed key</text>
<text class="cbod" x="58" y="184">in AWS KMS. Material</text>
<text class="cbod" x="58" y="204">never leaves KMS.</text>
<text class="eye mono" x="303.6" y="102">OPERATOR</text>
<text class="bnum-op mono" x="319.6" y="132" text-anchor="middle">2</text>
<text class="ctit" x="347.6" y="131">Trust Baseten</text>
<text class="cbod" x="303.6" y="164">IAM OIDC provider +</text>
<text class="cbod" x="303.6" y="184">a kms:Decrypt role that</text>
<text class="cbod" x="303.6" y="204">matches the sub claim.</text>
<text class="eye mono" x="549.2" y="102">OPERATOR</text>
<text class="bnum-op mono" x="565.2" y="132" text-anchor="middle">3</text>
<text class="ctit" x="593.2" y="131">Wrap &amp; encrypt</text>
<text class="cbod" x="549.2" y="164">GenerateDataKey → DEK.</text>
<text class="cbod" x="549.2" y="184">DEK encrypts weights</text>
<text class="cbod" x="549.2" y="204">→ weights.enc</text>
<text class="eye mono" x="794.8" y="102">OPERATOR</text>
<text class="bnum-op mono" x="811.8" y="132" text-anchor="middle">4a</text>
<text class="ctit" x="840.8" y="131">Publish bundle</text>
<text class="cbod" x="794.8" y="164">weights.enc, wrapped</text>
<text class="cbod" x="794.8" y="184">DEK, envelope.json → S3.</text>
<text class="cbod" x="794.8" y="204">Discard plaintext DEK.</text>
<text class="eye mono" x="1040.4" y="102">OPERATOR</text>
<text class="bnum-op mono" x="1057.9" y="132" text-anchor="middle">4b</text>
<text class="ctit" x="1087.4" y="131">Point Truss at it</text>
<text class="cbod" x="1040.4" y="164">S3 source, role ARN and</text>
<text class="cbod" x="1040.4" y="184">region into config.yaml,</text>
<text class="cbod" x="1040.4" y="204">then truss push.</text>
<text class="ztit mono" x="58" y="356">AWS KMS</text>
<text class="zbod" x="58" y="378">KEK created here.</text>
<text class="zbod" x="58" y="397">Key material stays.</text>
<text class="ztit mono" x="303.6" y="356">AWS IAM</text>
<text class="zbod" x="303.6" y="378">oidc.baseten.co provider</text>
<text class="zbod" x="303.6" y="397">+ KMS-Decrypt role</text>
<text class="ztit mono" x="549.2" y="356">AWS KMS</text>
<text class="zbod" x="549.2" y="378">Same KEK wraps the</text>
<text class="zbod" x="549.2" y="397">64-byte DEK.</text>
<text class="ztit mono" x="794.8" y="356">Amazon S3</text>
<text class="zbod" x="794.8" y="378">weights.enc · envelope.json</text>
<text class="zbod" x="794.8" y="397">encrypted-data-key</text>
<rect class="bp1" x="119.3" y="248" width="64.9" height="16"/>
<text class="albl-op mono" x="151.8" y="260" text-anchor="middle">CreateKey</text>
<rect class="bp1" x="317.5" y="248" width="159.7" height="16"/>
<text class="albl-op mono" x="397.4" y="260" text-anchor="middle">register provider + role</text>
<rect class="bp1" x="591.6" y="248" width="102.8" height="16"/>
<text class="albl-op mono" x="643" y="260" text-anchor="middle">GenerateDataKey</text>
<rect class="bp1" x="853.0" y="248" width="71.2" height="16"/>
<text class="albl-op mono" x="888.6" y="260" text-anchor="middle">PUT bundle</text>
<rect class="bp1" x="282.0" y="434" width="230.8" height="15"/>
<text class="tiel mono" x="397.4" y="445" text-anchor="middle">one and the same customer-managed KEK</text>
<rect class="bp1" x="1098.6" y="302" width="71.2" height="16"/>
<text class="albl-op mono" x="1134.2" y="314" text-anchor="middle">truss push</text>
<rect class="bp1" x="1076.5" y="319" width="115.5" height="16"/>
<text class="albl-mut mono" x="1134.2" y="331" text-anchor="middle">deploys the model</text>
<rect class="bp0" x="38" y="506" width="434.2" height="18"/>
<text class="blbl-auto mono" x="42" y="519">PHASE 2 — RUNTIME · your code, on every cold start</text>
<rect class="bp2" x="768.2" y="924" width="170.8" height="15"/>
<text class="zlbl mono" x="935" y="935" text-anchor="end">CUSTOMER AWS ACCOUNT</text>
<text class="eye mono" x="58" y="587">BASETEN · BDN</text>
<text class="bnum-bt mono" x="74" y="617" text-anchor="middle">5</text>
<text class="ctit" x="102" y="616">Baseten mounts it</text>
<text class="cbod" x="58" y="649">Sealed bundle to /models/custom,</text>
<text class="cbod" x="58" y="669">plus the OIDC token in the pod.</text>
<text class="cbod" x="58" y="689">Baseten's whole runtime role.</text>
<text class="eye mono" x="365" y="587">YOUR CODE · IN YOUR TRUSS</text>
<text class="bnum-auto mono" x="381" y="617" text-anchor="middle">6</text>
<text class="ctit" x="409" y="616">Token → credentials</text>
<text class="cbod" x="365" y="649">Pod reads its Baseten OIDC</text>
<text class="cbod" x="365" y="669">token and calls STS</text>
<text class="cbod" x="365" y="689">AssumeRoleWithWebIdentity.</text>
<text class="eye mono" x="672" y="587">YOUR CODE · IN YOUR TRUSS</text>
<text class="bnum-auto mono" x="688" y="617" text-anchor="middle">7</text>
<text class="ctit" x="716" y="616">Unwrap the DEK</text>
<text class="cbod" x="672" y="649">boto3 kms.decrypt(wrapped</text>
<text class="cbod" x="672" y="669">DEK, encryption context).</text>
<text class="cbod" x="672" y="689">Ciphertext never goes to KMS.</text>
<text class="eye mono" x="979" y="587">YOUR CODE · IN YOUR TRUSS</text>
<text class="bnum-auto mono" x="995" y="617" text-anchor="middle">8</text>
<text class="ctit" x="1023" y="616">Verify &amp; decrypt</text>
<text class="cbod" x="979" y="649">Verify HMAC over IV‖ciphertext,</text>
<text class="cbod" x="979" y="669">then AES-256-CBC decrypt. You</text>
<text class="cbod" x="979" y="689">choose where the plaintext goes.</text>
<text class="ztit mono" x="58" y="841">Amazon S3</text>
<text class="zbod" x="58" y="863">Encrypted weight bundle</text>
<text class="zbod" x="58" y="882">+ envelope metadata</text>
<text class="ztit mono" x="365" y="841">AWS STS</text>
<text class="zbod" x="365" y="863">AssumeRoleWithWebIdentity</text>
<text class="zbod" x="365" y="882">→ short-lived credentials</text>
<text class="ztit mono" x="672" y="841">AWS KMS</text>
<text class="zbod" x="672" y="863">Decrypt(wrapped DEK, ctx)</text>
<text class="zbod" x="672" y="882">under the same KEK</text>
<text class="ztit mono" x="979" y="841">Pod filesystem · this example</text>
<text class="zbod" x="979" y="863">/tmp/decrypted-weights/weights.json</text>
<text class="zbod" x="979" y="882">Ephemeral · dies with the pod</text>
<rect class="bp2" x="127.9" y="733" width="109.2" height="16"/>
<text class="albl-auto mono" x="182.5" y="745" text-anchor="middle">encrypted bundle</text>
<rect class="bp2" x="423.9" y="733" width="71.2" height="16"/>
<text class="albl-auto mono" x="459.5" y="745" text-anchor="middle">OIDC token</text>
<rect class="bp2" x="483.9" y="751" width="71.2" height="16"/>
<text class="albl-auto mono" x="519.5" y="763" text-anchor="middle">temp creds</text>
<rect class="bp2" x="708.8" y="733" width="115.5" height="16"/>
<text class="albl-auto mono" x="766.5" y="745" text-anchor="middle">wrapped DEK + ctx</text>
<rect class="bp2" x="781.1" y="751" width="90.9" height="16"/>
<text class="albl-auto mono" x="826.5" y="763" text-anchor="middle">plaintext DEK</text>
<rect class="bp2" x="1045.8" y="733" width="115.5" height="16"/>
<text class="albl-auto mono" x="1103.5" y="745" text-anchor="middle">decrypted weights</text>
</svg>
