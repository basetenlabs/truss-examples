<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1286 992" width="1286" height="992" role="img" aria-label="Weight encryption on Baseten, shown as two phases. Phase one is setup and is performed once by hand by the operator: create a customer-managed key encryption key in AWS KMS; register Baseten as an OIDC identity provider in AWS IAM and create a role limited to kms:Decrypt whose trust policy matches the OIDC sub claim; call GenerateDataKey and use the returned plaintext data key to encrypt the weights into weights.enc; publish weights.enc, the wrapped data key and envelope.json to Amazon S3 and discard the plaintext data key; then point config.yaml at the bundle and run truss push. Phase two runs on every cold start: Baseten mounts the still-encrypted bundle at /models/custom and makes the pod's OIDC token available, and everything after that is customer-owned code in the Truss, which exchanges the token at AWS STS for temporary credentials, calls KMS Decrypt with the wrapped data key and encryption context to recover the plaintext data key, then verifies the HMAC and AES-256-CBC decrypts the weights. The key encryption key never leaves the customer's AWS account, and the plaintext weights never leave the pod.">
<title>Weight encryption flow</title>
