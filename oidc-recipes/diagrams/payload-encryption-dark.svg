.zbod{font-size:11px;fill:#93a899}
.albl-op{font-size:10.5px;fill:#ffa9fd}
.albl-auto{font-size:10.5px;fill:#19e76e}
.albl-mut{font-size:10.5px;fill:#93a899}
.zlbl{font-size:10px;letter-spacing:1.4px;fill:#9ca59e}
.blbl-op{font-size:12px;font-weight:700;letter-spacing:1.3px;fill:#ffa9fd}
.blbl-auto{font-size:12px;font-weight:700;letter-spacing:1.3px;fill:#19e76e}
.tiel{font-size:10px;fill:#9ca59e}
.ln-op{stroke:#ffa9fd;stroke-width:1.4;fill:none}
.ln-auto{stroke:#19e76e;stroke-width:1.4;fill:none}
.dash-op{stroke:#ffa9fd;stroke-width:1.4;fill:none;stroke-dasharray:6 4}
.dash-auto{stroke:#19e76e;stroke-width:1.4;fill:none;stroke-dasharray:6 4}
.chev-op{stroke:#ffa9fd;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chev-auto{stroke:#19e76e;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tie{fill:none;stroke:#9ca59e;stroke-width:1;stroke-dasharray:2 4}</style>
