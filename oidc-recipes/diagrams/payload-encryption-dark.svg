<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1268 1026" width="1268" height="1026" role="img" aria-label="Payload encryption on Baseten, shown as setup and per-request phases. Setup is performed once by hand by the operator: run setup.sh, which creates the KMS key, the OIDC provider and a runtime role restricted to kms:Decrypt with the expected encryption context; grant the client's own AWS identity kms:GenerateDataKey on the same key; then copy the role ARN and region into config.yaml and run truss push. On every request, all of it customer-owned code: the client calls GenerateDataKey, encrypts the request with the plaintext data key and POSTs a versioned JSON envelope containing the wrapped data key, encryption context, IV, HMAC and ciphertext to the /predict endpoint; code in the pod exchanges its OIDC token at AWS STS and calls KMS Decrypt to unwrap the data key; it verifies the HMAC, decrypts and runs inference in memory; it re-encrypts the response with the same data key and a new IV; and the client decrypts that response using the plaintext data key it retained.">
<title>Payload encryption flow</title>
