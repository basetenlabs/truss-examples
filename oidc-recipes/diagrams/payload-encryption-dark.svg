<rect class="card-auto" x="647" y="599" width="276.5" height="142"/>
<circle class="badge-auto" cx="679" cy="647.0" r="16.0"/>
<path class="chev-auto" d="M931.5,664 L941.5,670 L931.5,676"/>
<rect class="card-auto" x="949.5" y="599" width="276.5" height="142"/>
<circle class="badge-auto" cx="981.5" cy="647.0" r="16.0"/>
<rect class="chip" x="42" y="847" width="276.5" height="85"/>
<rect class="chip" x="344.5" y="847" width="276.5" height="85"/>
<rect class="chip-dash" x="647" y="847" width="276.5" height="85"/>
<rect class="chip-dash" x="949.5" y="847" width="276.5" height="85"/>
<line class="ln-auto" x1="180.2" y1="741" x2="180.2" y2="842" marker-end="url(#aauto)"/>
