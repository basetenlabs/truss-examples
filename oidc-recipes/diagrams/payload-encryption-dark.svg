<line class="ln-auto" x1="785.2" y1="741" x2="785.2" y2="842" marker-end="url(#aauto)"/>
<line class="ln-auto" x1="1087.8" y1="741" x2="1087.8" y2="842" marker-end="url(#aauto)"/>
<polyline class="dash-auto" points="1226,639 1232,639 1232,565 863.1,565"/>
<polyline class="dash-auto" points="404.9,565 180.2,565 180.2,594" marker-end="url(#aauto)"/>
<circle class="badge-auto" cx="434.9" cy="561" r="16"/>
<rect class="bp0" x="38" y="21" width="297.8" height="18"/>
<text class="blbl-op mono" x="42" y="34">SETUP — you run this once, by hand</text>
<rect class="bp1" x="653.8" y="439" width="170.8" height="15"/>
<text class="zlbl mono" x="820.7" y="450" text-anchor="end">CUSTOMER AWS ACCOUNT</text>
<text class="eye mono" x="58" y="102">OPERATOR</text>
<text class="bnum-op mono" x="74" y="132" text-anchor="middle">A</text>
<text class="ctit" x="102" y="131">Run setup.sh</text>
<text class="cbod" x="58" y="164">Creates the KMS key, the OIDC provider,</text>
<text class="cbod" x="58" y="184">and a runtime role restricted to</text>
<text class="cbod" x="58" y="204">kms:Decrypt with the expected context.</text>
<text class="eye mono" x="461.3" y="102">OPERATOR</text>
<text class="bnum-op mono" x="477.3" y="132" text-anchor="middle">B</text>
<text class="ctit" x="505.3" y="131">Grant the client GenerateDataKey</text>
<text class="cbod" x="461.3" y="164">Whatever AWS identity your client code</text>
<text class="cbod" x="461.3" y="184">runs as needs kms:GenerateDataKey on</text>
<text class="cbod" x="461.3" y="204">the same key. It keeps the plaintext DEK.</text>
<text class="eye mono" x="864.7" y="102">OPERATOR</text>
<text class="bnum-op mono" x="880.7" y="132" text-anchor="middle">C</text>
<text class="ctit" x="908.7" y="131">Configure and push</text>
<text class="cbod" x="864.7" y="164">Copy the role ARN and region into</text>
<text class="cbod" x="864.7" y="184">config.yaml, then truss push.</text>
<text class="ztit mono" x="58" y="356">AWS KMS + AWS IAM</text>
<text class="zbod" x="58" y="378">Customer-managed KEK · oidc.baseten.co provider</text>
<text class="zbod" x="58" y="397">Runtime role: kms:Decrypt, encryption context pinned</text>
<text class="ztit mono" x="461.3" y="356">Client AWS identity</text>
<text class="zbod" x="461.3" y="378">kms:GenerateDataKey on the same KEK.</text>
<text class="zbod" x="461.3" y="397">Never granted kms:Decrypt — it never needs it.</text>
<rect class="bp1" x="204.5" y="248" width="52.3" height="16"/>
<text class="albl-op mono" x="230.7" y="260" text-anchor="middle">creates</text>
<rect class="bp1" x="611.0" y="248" width="45.9" height="16"/>
<text class="albl-op mono" x="634" y="260" text-anchor="middle">grants</text>
<rect class="bp1" x="1001.7" y="302" width="71.2" height="16"/>
<text class="albl-op mono" x="1037.3" y="314" text-anchor="middle">truss push</text>
<rect class="bp0" x="38" y="506" width="391.6" height="18"/>
<text class="blbl-auto mono" x="42" y="519">PER REQUEST — your code, on every single call</text>
<rect class="bp2" x="452.2" y="958" width="170.8" height="15"/>
<text class="zlbl mono" x="619" y="969" text-anchor="end">CUSTOMER AWS ACCOUNT</text>
<text class="eye mono" x="58" y="621">YOUR CLIENT CODE</text>
<text class="bnum-auto mono" x="74" y="651" text-anchor="middle">1</text>
<text class="ctit" x="102" y="650">Seal the request</text>
<text class="cbod" x="58" y="683">GenerateDataKey → plaintext</text>
<text class="cbod" x="58" y="703">+ wrapped DEK. Encrypt, then</text>
<text class="cbod" x="58" y="723">POST a versioned JSON envelope.</text>
<text class="eye mono" x="360.5" y="621">YOUR CODE · IN THE POD</text>
<text class="bnum-auto mono" x="376.5" y="651" text-anchor="middle">2</text>
<text class="ctit" x="404.5" y="650">Unwrap the DEK</text>
<text class="cbod" x="360.5" y="683">Pod exchanges its OIDC token</text>
<text class="cbod" x="360.5" y="703">at STS, then calls KMS Decrypt</text>
<text class="cbod" x="360.5" y="723">with the wrapped DEK + context.</text>
<text class="eye mono" x="663" y="621">YOUR CODE · IN THE POD</text>
<text class="bnum-auto mono" x="679" y="651" text-anchor="middle">3</text>
<text class="ctit" x="707" y="650">Verify, decrypt, infer</text>
<text class="cbod" x="663" y="683">HMAC check over IV‖ciphertext,</text>
<text class="cbod" x="663" y="703">AES-256-CBC decrypt, run</text>
<text class="cbod" x="663" y="723">inference on the plaintext.</text>
<text class="eye mono" x="965.5" y="621">YOUR CODE · IN THE POD</text>
<text class="bnum-auto mono" x="981.5" y="651" text-anchor="middle">4</text>
<text class="ctit" x="1009.5" y="650">Re-seal the response</text>
<text class="cbod" x="965.5" y="683">Same DEK, brand-new IV.</text>
<text class="cbod" x="965.5" y="703">No second KMS call — the DEK</text>
<text class="cbod" x="965.5" y="723">is already in memory.</text>
<text class="ztit mono" x="58" y="875">AWS KMS</text>
<text class="zbod" x="58" y="897">GenerateDataKey, called by</text>
<text class="zbod" x="58" y="916">the client's own AWS identity</text>
<text class="ztit mono" x="360.5" y="875">AWS STS → AWS KMS</text>
<text class="zbod" x="360.5" y="897">AssumeRoleWithWebIdentity,</text>
<text class="zbod" x="360.5" y="916">then Decrypt(wrapped DEK, ctx)</text>
<text class="ztit mono" x="663" y="875">Pod memory only</text>
<text class="zbod" x="663" y="897">Plaintext request never</text>
<text class="zbod" x="663" y="916">written to disk or logged</text>
<text class="ztit mono" x="965.5" y="875">Wire format</text>
<text class="zbod" x="965.5" y="897">version, wrapped DEK, encryption</text>
<text class="zbod" x="965.5" y="916">context, IV, HMAC, ciphertext</text>
<rect class="bp2" x="128.8" y="767" width="102.8" height="16"/>
<text class="albl-auto mono" x="180.2" y="779" text-anchor="middle">GenerateDataKey</text>
<rect class="bp2" x="375.7" y="767" width="154.1" height="16"/>
<text class="albl-auto mono" x="452.8" y="779" text-anchor="middle">OIDC token, wrapped DEK</text>
<rect class="bp2" x="429.4" y="785" width="166.7" height="16"/>
<text class="albl-auto mono" x="512.8" y="797" text-anchor="middle">temp creds, plaintext DEK</text>
<rect class="bp2" x="721.2" y="767" width="128.1" height="16"/>
<text class="albl-auto mono" x="785.2" y="779" text-anchor="middle">plaintext in memory</text>
<rect class="bp2" x="1030.0" y="767" width="115.5" height="16"/>
<text class="albl-auto mono" x="1087.8" y="779" text-anchor="middle">response envelope</text>
<text class="bnum-auto mono" x="434.9" y="565" text-anchor="middle">5</text>
<rect class="bp2" x="454.9" y="553" width="356.4" height="16"/>
<text class="albl-auto mono" x="458.9" y="565">sealed response → client decrypts with its retained DEK</text>
<rect class="bp2" x="286.4" y="575" width="90.2" height="16"/>
<text class="albl-auto mono" x="331.5" y="587" text-anchor="middle">POST /predict</text>
</svg>
