model_name: Triton TensorRT-LLM OpenAI
description: NVIDIA Triton with TensorRT-LLM backend and OpenAI-compatible API on Baseten.

model_metadata:
  example_model_input:
    model: ensemble
    messages:
      - role: user
        content: What is machine learning?
    max_tokens: 64
    temperature: 0.0
  tags:
    - triton
    - tensorrt-llm
    - openai-compatible
    - text-generation
    - bdn
    - custom-server

base_image:
  image: nvcr.io/nvidia/tritonserver:24.11-trtllm-python-py3

docker_server:
  run_as_user_id: 1000
  start_command: bash /app/data/start-openai.sh
  server_port: 8000
  predict_endpoint: /v1/chat/completions
  readiness_endpoint: /health/ready
  liveness_endpoint: /health/ready

environment_variables:
  ENGINE_DIR: /models/engine
  TOKENIZER_DIR: /models/tokenizer
  TRTLLM_ORCHESTRATOR: "1"

# Replace YOUR_ORG/your-trtllm-engine-repo with a HuggingFace repo (or s3://) that
# contains a TensorRT-LLM engine built for your target GPU topology.
weights:
  - source: hf://YOUR_ORG/your-trtllm-engine-repo@main
    mount_location: /models/engine
    auth:
      auth_method: CUSTOM_SECRET
      auth_secret_name: hf_access_token
  - source: hf://meta-llama/Llama-3.1-8B-Instruct@main
    mount_location: /models/tokenizer
    auth:
      auth_method: CUSTOM_SECRET
      auth_secret_name: hf_access_token
    allow_patterns:
      - "tokenizer*"
      - "config.json"
      - "special_tokens_map.json"
      - "*.json"

resources:
  accelerator: A100
  use_gpu: true

runtime:
  predict_concurrency: 32
  health_checks:
    restart_threshold_seconds: 1200
    stop_traffic_threshold_seconds: 600

secrets:
  hf_access_token: null

requirements: []
system_packages: []
external_package_dirs: []

build_commands:
  - pip install /opt/tritonserver/python/triton*.whl
  - pip install -r /opt/tritonserver/python/openai/requirements.txt
  - chmod +x /app/data/start-openai.sh
