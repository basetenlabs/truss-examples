# yaml-language-server: $schema=https://raw.githubusercontent.com/basetenlabs/truss/main/truss/config.schema.json
model_name: "model:Nemotron-3.5-Embed-8B preset:throughput"

model_metadata:
  example_model_input:
    model: nvidia/Nemotron-3.5-Embed-8B-BF16
    messages:
      - role: system
        content: "query:"
      - role: user
        content:
          - type: text
            text: What is NVIDIA NeMo Framework?
    encoding_format: float
    dimensions: 4096
  repo_id: nvidia/Nemotron-3.5-Embed-8B-BF16
  tags:
    - openai-compatible
    - embedding
    - multimodal
    - vllm

# vLLM 0.32.0 is the version on NVIDIA's model card.
base_image:
  image: vllm/vllm-openai:v0.32.0

docker_server:
  start_command: >-
    vllm serve /models/nemotron-3.5-embed-8b
    --host 0.0.0.0
    --port 8000
    --served-model-name nvidia/Nemotron-3.5-Embed-8B-BF16
    --runner pooling
    --dtype bfloat16
    --hf-overrides.is_matryoshka true
    --compilation-config.compile_mm_encoder true
    --chat-template-content-format openai
    --limit-mm-per-prompt.image 1
    --max-model-len 32768
    --max-num-batched-tokens 65536
    --max-num-seqs 64
    --gpu-memory-utilization 0.90

  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/embeddings
  server_port: 8000

weights:
  - source: "hf://nvidia/Nemotron-3.5-Embed-8B-BF16@f30256172b5192672824e1d718251aae0ed8bc45"
    mount_location: "/models/nemotron-3.5-embed-8b"

resources:
  instance_type: H100

runtime:
  predict_concurrency: 64
  health_checks:
    startup_threshold_seconds: 900
    restart_threshold_seconds: 600
    stop_traffic_threshold_seconds: 240

environment_variables:
  VLLM_LOGGING_LEVEL: INFO

secrets: {}
system_packages: []
requirements: []
