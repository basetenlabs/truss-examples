# Registry copy of the config serving the ZeroEntropy lab listing zeroentropy/zembed-1
# (Hugging Face Text Embeddings Inference). Values below are the deployed ones. Two things
# differ in form, not effect: model_name follows the repo convention, and the checkpoint is
# pinned to cf13c81f (the Apache-2.0 relicense) instead of the deployed 10378878; every
# model file is byte-identical between the two revisions, only LICENSE/README changed.
model_name: model:zembed-1-embedding-4b preset:throughput
model_metadata:
  repo_id: zeroentropy/zembed-1-embedding
  example_model_input:
    inputs:
      - What is backpropagation?
    prompt_name: query
    dimensions: 1280
base_image:
  image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
  python_executable_path: /usr/bin/true
environment_variables:
  HF_HUB_DISABLE_XET: "1"
build_commands:
  - mkdir -p /data /tmp/hf-cache && chmod -R 777 /data /tmp/hf-cache
weights:
  - source: hf://zeroentropy/zembed-1-embedding@cf13c81f3274394053d166740294f7eea4586f7a
    mount_location: /data/zembed-1-embedding
docker_server:
  start_command: >-
    text-embeddings-router-90
    --model-id /data/zembed-1-embedding
    --served-model-name zembed-1
    --hostname 0.0.0.0
    --port 3000
    --dtype float16
    --max-concurrent-requests 4096
    --max-client-batch-size 128
    --max-batch-tokens 8192
    --payload-limit 8388608
    --huggingface-hub-cache /tmp/hf-cache
    --default-prompt-name document
    --json-output
  server_port: 3000
  predict_endpoint: /embed
  readiness_endpoint: /health
  liveness_endpoint: /health
resources:
  accelerator: H100
  instance_type: H100
  use_gpu: true
runtime:
  predict_concurrency: 64
  streaming_read_timeout: 300
