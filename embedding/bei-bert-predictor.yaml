# Base template: BEI-Bert (BERT/bidirectional encoder) - Classifier/Predictor model
# Use for: BERT-family classifiers (ForSequenceClassification, multiple labels)
# e.g. sentiment, language detection, go_emotions
# No fp8/fp4 support. Varies per model: model_name, accelerator, repo, max_num_tokens
model_metadata:
  example_model_input:
    inputs:
    - - Baseten is a fast inference provider
    - - Classify this separately.
    raw_scores: true
    truncate: true
    truncation_direction: Right
model_name: BEI-Bert-<org>-<model-name>-classification-truss-example
python_version: py39
resources:
  accelerator: L4
  cpu: '1'
  memory: 10Gi
  use_gpu: true
trt_llm:
  build:
    base_model: encoder_bert
    checkpoint_repository:
      repo: <org>/<model-name>
      revision: main
      source: HF
    max_num_tokens: 16384
  runtime:
    webserver_default_route: /predict
