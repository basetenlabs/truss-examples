model_name: "model:deepseek-v4-pro preset:latency"
model_metadata:
  description: >-
    DeepSeek V4 Pro MoE reasoning model served with vLLM (B200 tensor + expert parallelism),
    OpenAI-compatible chat with tooling and MTP speculative decoding.
  repo_id: deepseek-ai/DeepSeek-V4-Pro
  example_model_input:
    messages:
      - role: user
        content: "What is the meaning of life?"
    stream: true
    model: deepseek-ai/DeepSeek-V4-Pro
    max_tokens: 32768
    temperature: 1.0
  tags:
    - openai-compatible
base_image:
  image: baseten/vllm-openai:pr-43447-updated-latest
weights:
  - source: "hf://deepseek-ai/DeepSeek-V4-Pro@main"
    mount_location: "/app/checkpoint/model"
    auth_secret_name: "hf_access_token"
secrets:
  hf_access_token: null
resources:
  instance_type: B200:8
environment_variables:
  VLLM_LOGGING_LEVEL: WARNING
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
docker_server:
  start_command: >-
    sh -c 'GPU_COUNT=$(nvidia-smi --list-gpus | wc -l) && vllm serve /app/checkpoint/model
    --served-model-name deepseek-ai/DeepSeek-V4-Pro
    --trust-remote-code
    --enable-chunked-prefill
    --enable-prefix-caching
    --kv-cache-dtype fp8
    --block-size 256
    --max-num-seqs 32
    --max-model-len auto
    --moe-backend deep_gemm_mega_moe
    --attention_config.use_fp4_indexer_cache true
    --prefix-cache-retention-interval auto
    --enable-expert-parallel
    --tensor-parallel-size $GPU_COUNT
    --max-num-batched-tokens 8192
    --gpu-memory-utilization 0.95
    --tokenizer-mode deepseek_v4
    --tool-call-parser deepseek_v4
    --enable-auto-tool-choice
    --reasoning-parser deepseek_v4
    --speculative-config.method mtp
    --speculative-config.num_speculative_tokens 3
    --load-format runai_streamer'
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000

runtime:
  predict_concurrency: 64
  health_checks:
    restart_check_delay_seconds: 1800
    restart_threshold_seconds: 1200
    stop_traffic_threshold_seconds: 120
