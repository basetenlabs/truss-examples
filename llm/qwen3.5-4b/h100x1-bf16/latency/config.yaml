# BIS-LLM (vLLM backend) conversion of this preset, in place: same path, new deployment model
# `preset:bis-latency` because the platform rejects BIS deployments into the old KNATIVE model.
# Kept from the vLLM docker_server preset: same checkpoint and revision, 32,768 context, BF16, 0.95 GPU memory, prefix caching, image input, qwen3 reasoning and qwen3_coder tool parsers.
#
# Serving image: the 2026-11-02 MP release (baseten/bis-llm-vllm:mp-v2026.11.02), pinned by its
# green tag. No bis_llm.version: the platform's current chart is used.
#
# Differences from the vLLM preset:
# - Qwen3.5 hybrid GDN settings from llm/qwen3.5-9b-bis: --mamba-cache-mode align,
#   --gdn-prefill-backend triton, DYN_KV_EVENT_MAIN_GROUP_IDX 3 (KV events from the
#   full-attention group), capped worker thread pools.
# - Images are planned by the BIS frontend and encoded by the worker (frontend_plan_worker_exec);
#   video is off. family: qwen35 is set explicitly: the encoder only resolves known Qwen repo
#   names, and an alias (e.g. Hcompany/Holo-3.1) otherwise fails with "Unknown encoder model".
# - max_num_seqs 128 replaces predict_concurrency 128.
model_name: model:qwen3.5-4b preset:bis-latency
model_metadata:
  description: Qwen 3.5 4B instruct (dense) on one H100 with image input and Qwen tool calling, served
    with vLLM through the Baseten Inference Stack.
  repo_id: Qwen/Qwen3.5-4B
  example_model_input:
    model: Qwen/Qwen3.5-4B
    messages:
    - role: user
      content: What is the capital of France?
    stream: true
    max_tokens: 100
    temperature: 0.7
  tags:
  - openai-compatible
bis_llm:
  config:
    additional_environment_variables:
      Worker:
        DYN_KV_EVENT_MAIN_GROUP_IDX: '3'
        HF_HUB_ENABLE_HF_TRANSFER: '1'
        MKL_NUM_THREADS: '4'
        OMP_NUM_THREADS: '1'
        RAYON_NUM_THREADS: '4'
        SAFETENSORS_FAST_GPU: '1'
        TOKENIZERS_PARALLELISM: 'false'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_LOGGING_LEVEL: WARNING
    arguments_as_json: true
    b10_routing_config:
      algo_selector: B10
      durable_kv_events: false
      enable_worker_tree: true
      router_cache_miss_weight: 0
      router_overlap_score_weight: 1000
      router_temperature: 0.001
    b10_vision_config:
      encoding_mode: frontend_plan_worker_exec
      enabled: true
      family: qwen35
      max_videos: 0
    checkpoint_name: Qwen/Qwen3.5-4B
    engine_backend: vllm
    engine_config:
      dtype: bfloat16
      enable_chunked_prefill: true
      enable_prefix_caching: true
      enforce_eager: false
      gpu_memory_utilization: 0.95
      kv_events_endpoint: tcp://*:5557
      max_model_len: 32768
      max_num_seqs: 128
      trust_remote_code: true
      vllm_extra_args:
      - --mamba-cache-mode
      - align
      - --reasoning-parser
      - qwen3
      - --gdn-prefill-backend
      - triton
    gpuTRTImage: baseten/bis-llm-vllm:green-mp--v0.26.0-d9e38b3e4-b6573aaba5
    language_model_only: false
    model_name: Qwen/Qwen3.5-4B
    model_path: /models/qwen3.5-4b
    reasoning_parser: qwen3
    served_model_name: Qwen/Qwen3.5-4B
    served_model_name_response: Qwen/Qwen3.5-4B
    tensor_parallel_size: 1
    tokenizer_limit_length: 32768
    tool_call_parser: qwen3_coder
environment_variables: {}
resources:
  accelerator: H100:1
  use_gpu: true
weights:
- source: hf://Qwen/Qwen3.5-4B@851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  mount_location: /models/qwen3.5-4b
