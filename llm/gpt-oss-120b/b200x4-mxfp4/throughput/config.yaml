# Registry copy of the config serving the Baseten library listing
# baseten/gpt-oss-120b (BIS-LLM, TRT-LLM PyTorch backend behind Dynamo cache-aware routing). The bis_llm block,
# environment, and weights values are the deployed values from BIS Config Registry
# composer `gpt-oss-120b` (bcr_version 1.0.5) verbatim; model_name
# follows the repo convention and resources use instance_type.
model_name: "model:gpt-oss-120b preset:bis-throughput"
model_metadata:
  repo_id: openai/gpt-oss-120b
  tags:
    - openai-compatible
  example_model_input:
    messages:
      - role: user
        content: "What is the meaning of life?"
    stream: true
    model: openai/gpt-oss-120b
    max_tokens: 1024
bis_llm:
  config:
    additional_environment_variables:
      Worker:
        BAD_TOKEN_ID_SEQ_CHECK_ENABLED: "1"
        MIMALLOC_PURGE_DELAY: "0"
        NCCL_GRAPH_MIXING_SUPPORT: "0"
        PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
        TLLM_NUMA_AWARE_WORKER_AFFINITY: "1"
        TRTLLM_ENABLE_PDL: "1"
        TRTLLM_SERVER_DISABLE_GC: "1"
        TRTLLM_WORKER_DISABLE_GC: "1"
    b10_routing_config:
      algo_selector: B10
      durable_kv_events: false
      enable_worker_tree: true
      rate_limit_batch_multiplier: 2
      rate_limit_enabled: true
      router_active_request_weight: 2
      router_cache_miss_min_isl: 1024
      router_cache_miss_weight: 0.02
      router_prefill_token_discount: 0.3
      router_queue_policy: wspt
    chat_processor: harmony
    checkpoint_name: openai/gpt-oss-120b
    engine_config:
      backend: pytorch
      cuda_graph_config:
        batch_sizes:
          - 1
          - 2
          - 4
          - 8
          - 16
          - 24
          - 32
          - 40
          - 48
          - 56
          - 64
        enable_padding: true
        max_batch_size: 64
      disable_overlap_scheduler: false
      enable_autotuner: true
      enable_chunked_prefill: true
      enable_iter_perf_stats: true
      guided_decoding_backend: xgrammar
      kv_cache_config:
        enable_block_reuse: true
        enable_partial_reuse: false
        event_buffer_max_size: 16384
        free_gpu_memory_fraction: 0.9
        host_cache_size: 120000000000
      max_batch_size: 64
      max_beam_width: 1
      max_input_len: 131072
      max_num_tokens: 16384
      max_seq_len: 131072
      moe_config:
        backend: TRTLLM
      moe_expert_parallel_size: 4
      sampler_type: TRTLLMSampler
      stream_interval: 4
      trust_remote_code: true
    gpuTRTImage: "baseten/dynamo-cache-aware-routing:bis-4nf059--trtllm-dfe755294d-c409f2fff-b690c11391"
    model_level_stop_words:
      - <|call|>
    model_name: openai/gpt-oss-120b
    model_path: /models/gpt-oss-120b
    reasoning_effort_policy:
      allowed:
        - low
        - medium
        - high
      default: medium
    tensor_parallel_size: 4
    tokenizer_limit_length: 131072
  version: 0.0.1-20260804033840-1d68536d
environment_variables: {}
resources:
  instance_type: "B200:4"
weights:
  # Public, ungated checkpoint (Apache-2.0); the auth secret is dropped. Pinned to
  # the revision `@main` resolved to (unchanged since 2025-08-26).
  - mount_location: /models/gpt-oss-120b
    source: "hf://openai/gpt-oss-120b@b5c939de8f754692c1647ca79fbf85e8c1e70f8a"
