# Public-artifact port of the Model API production config for openai/gpt-oss-120b
# (mapi/openai/gpt-oss-120b/config.yaml). Every bis_llm field, including the
# `gpuTRTImage` serving image and the `bis_llm.version` pin, is kept verbatim from
# production. The platform-default image that `engine_backend: trtllm` alone selects
# rejects `chat_processor: harmony`, so the production image is pinned. The checkpoint
# is public and ungated (Apache-2.0), so no HF auth secret. model_name follows the repo
# convention and resources use instance_type.
model_name: model:gpt-oss-120b preset:latency
model_metadata:
  repo_id: openai/gpt-oss-120b
  tags:
  - openai-compatible
  example_model_input:
    model: openai/gpt-oss-120b
    stream: true
    messages:
    - role: system
      content: You are a helpful assistant.
    - role: user
      content: Summarize the rules of chess in three sentences.
bis_llm:
  config:
    model_name: openai/gpt-oss-120b
    gpuTRTImage: baseten/bis-llm-trtllm:green-mp--ec11764bde-4884584f6-49e724f969
    engine_config:
      backend: pytorch
      moe_config:
        backend: TRTLLM
      max_seq_len: 131072
      sampler_type: TRTLLMSampler
      max_input_len: 131072
      max_batch_size: 64
      max_beam_width: 1
      max_num_tokens: 32768
      kv_cache_config:
        host_cache_size: 120000000000
        enable_block_reuse: true
        enable_partial_reuse: false
        event_buffer_max_size: 16384
        free_gpu_memory_fraction: 0.8
      stream_interval: 4
      enable_autotuner: true
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 24
        - 32
        - 40
        - 48
        - 56
        - 64
        enable_padding: true
        max_batch_size: 64
      trust_remote_code: true
      enable_chunked_prefill: true
      enable_iter_perf_stats: true
      guided_decoding_backend: xgrammar
      moe_expert_parallel_size: 2
      disable_overlap_scheduler: false
    chat_processor: harmony
    checkpoint_name: openai/gpt-oss-120b
    b10_routing_config:
      algo_selector: B10
      durable_kv_events: false
      enable_worker_tree: true
      rate_limit_enabled: true
      router_queue_policy: wspt
      router_cache_miss_weight: 0.02
      router_cache_miss_min_isl: 1024
      rate_limit_batch_multiplier: 2
      router_active_request_weight: 2
      router_prefill_token_discount: 0.3
    tensor_parallel_size: 4
    model_level_stop_words:
    - <|call|>
    tokenizer_limit_length: 131072
    additional_environment_variables:
      Worker:
        TRTLLM_ENABLE_PDL: '1'
        MIMALLOC_PURGE_DELAY: '0'
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        NCCL_GRAPH_MIXING_SUPPORT: '0'
        BAD_TOKEN_ID_SEQ_CHECK_ENABLED: '1'
        TLLM_NUMA_AWARE_WORKER_AFFINITY: '1'
  version: 0.0.1-20261001221953-8f302211
environment_variables: {}
resources:
  instance_type: B200:4
weights:
# Public, ungated checkpoint, pinned to the revision `@main` resolved to.
- source: hf://openai/gpt-oss-120b@b5c939de8f754692c1647ca79fbf85e8c1e70f8a
  mount_location: /models/gpt-oss-120b
