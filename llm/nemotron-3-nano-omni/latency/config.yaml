model_name: "model:nemotron-3-nano-omni preset:latency"
model_metadata:
  description: >-
    NVIDIA Nemotron 3 Nano Omni reasoning model (multimodal vLLM), long-context with video/image/audio prompts.
  repo_id: nvidia/nemotron-3-nano-omni
  example_model_input:
    model: nvidia/nemotron-3-nano-omni
    messages:
      - role: user
        content: "Hello, what can you do?"
    stream: true
    max_tokens: 512
    temperature: 0.2
  tags:
    - openai-compatible
base_image:
  image: vllm/vllm-openai:v0.22.0-cu129
weights:
  - source: "hf://baseten-admin/nemotron-3-nano-omni-ga@main"
    mount_location: "/app/checkpoint/model"
    auth_secret_name: "hf_access_token"
secrets:
  hf_access_token: null
docker_server:
  start_command: >-
    sh -c 'GPU_COUNT=$(nvidia-smi --list-gpus | wc -l) && vllm serve /app/checkpoint/model --tensor-parallel-size $GPU_COUNT
    --trust-remote-code
    --host 0.0.0.0
    --port 8000
    --max-model-len 65536
    --allowed-local-media-path /
    --served-model-name nvidia/nemotron-3-nano-omni
    --max-num-seqs 1
    --gpu-memory-utilization 0.85
    --limit-mm-per-prompt.video 1
    --limit-mm-per-prompt.image 1
    --limit-mm-per-prompt.audio 1
    --media-io-kwargs.video.fps 2
    --media-io-kwargs.video.num_frames 256
    --mamba-ssm-cache-dtype float32
    --reasoning-parser nemotron_v3
    --enable-prefix-caching
    --load-format runai_streamer'
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
environment_variables:
  VLLM_LOGGING_LEVEL: WARNING
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
resources:
  accelerator: H100
  use_gpu: true
runtime:
  predict_concurrency: 1
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 1200
    stop_traffic_threshold_seconds: 120
