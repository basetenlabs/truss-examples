model_name: "model:nemotron-3-nano-omni preset:latency"
base_image:
  image: nvcr.io/0767305323357365/n3-nano-omni/nemotron-3-nano-omni-reasoning-30b-a3b:latest-cu129
model_metadata:
  repo_id: baseten-admin/nemotron-3-nano-omni-ga
  example_model_input:
    model: nvidia/nemotron-3-nano-omni
    messages:
      - role: user
        content: "Hello, what can you do?"
    stream: true
    max_tokens: 512
    temperature: 0.2
  tags:
    - openai-compatible
weights:
  - source: "hf://baseten-admin/nemotron-3-nano-omni-ga@main"
    mount_location: "/app/checkpoint/nemotron"
    auth_secret_name: "hf_access_token"
docker_server:
  start_command: >-
    sh -c "vllm serve /app/checkpoint/nemotron
    --trust-remote-code
    --max-model-len 65536
    --allowed-local-media-path /
    --served-model-name nvidia/nemotron-3-nano-omni
    --host 0.0.0.0
    --port 8000
    --max-num-seqs 1
    --gpu-memory-utilization 0.85
    --limit-mm-per-prompt '{\"video\": 1, \"image\": 1, \"audio\": 1}'
    --media-io-kwargs '{\"video\": {\"fps\": 2, \"num_frames\": 256}}'
    --mamba-ssm-cache-dtype float32
    --reasoning-parser nemotron_v3"
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
environment_variables:
  VLLM_LOGGING_LEVEL: INFO
resources:
  accelerator: H100
  use_gpu: true
secrets:
  hf_access_token: null
  DOCKER_REGISTRY_nvcr.io: null
runtime:
  predict_concurrency: 1
  health_checks:
    restart_check_delay_seconds: 300
    restart_threshold_seconds: 300
    stop_traffic_threshold_seconds: 120
