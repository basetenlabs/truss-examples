# Registry copy of the config serving the Baseten library listing baseten/deepseek-v4-flash
# (BIS-LLM). The bis_llm block and environment are the deployed values verbatim; model_name
# follows the repo convention, resources use instance_type, and the weights entry drops the
# workspace-specific auth secret because the checkpoint is public and ungated.
model_name: "model:deepseek-v4-flash preset:bis-latency"
model_metadata:
  repo_id: deepseek-ai/DeepSeek-V4-Flash-0731
  tags:
    - openai-compatible
  example_model_input:
    messages:
      - role: user
        content: "What is the meaning of life?"
    stream: true
    model: deepseek-ai/DeepSeek-V4-Flash-0731
    max_tokens: 32768
    temperature: 1
environment_variables: {}
resources:
  instance_type: B200:4
bis_llm:
  version: 0.0.1-20260727180920-c08268b2
  config:
    model_name: deepseek-ai/DeepSeek-V4-Flash-0731
    model_path: /models/deepseek-v4-flash
    model_path_for_tokenizer: /models/deepseek-v4-flash/tokenizer
    checkpoint_name: deepseek-ai/DeepSeek-V4-Flash-0731
    gpuTRTImage: baseten/dynamo-cache-aware-routing:trtllm-rc23-1.3.0rc23-f598f80c4-e3957193bc
    served_model_name: deepseek-ai/DeepSeek-V4-Flash-0731
    served_model_name_response: deepseek-ai/DeepSeek-V4-Flash-0731
    chat_processor: deepseek_v4
    reasoning_parser: deepseek_v4
    tool_call_parser: deepseek_v4
    arguments_as_json: true
    tensor_parallel_size: 4
    tokenizer_limit_length: 1048576
    tokenizer_max_new_tokens_limit: 32768
    default_thinking_enabled: true
    default_sampling_params:
      top_p: 1
      temperature: 1
    b10_routing_config:
      durable_kv_events: false
      enable_worker_tree: true
      router_track_residency: true
      router_overlap_score_weight: 8
    additional_environment_variables:
      Worker:
        TRTLLM_ENABLE_PDL: "1"
        BAD_TOKEN_ID_SEQ_LEN: "10"
        BAD_TOKEN_ID_SEQ_CHECK_ENABLED: "1"
    engine_config:
      backend: pytorch
      trust_remote_code: true
      max_seq_len: 1048576
      max_input_len: 1048576
      max_batch_size: 8
      max_beam_width: 1
      max_num_tokens: 8192
      enable_chunked_prefill: true
      enable_iter_perf_stats: true
      moe_expert_parallel_size: 4
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      kv_cache_config:
        dtype: fp8
        host_cache_size: 100000000000
        tokens_per_block: 128
        enable_block_reuse: true
        enable_partial_reuse: false
        event_buffer_max_size: 65536
        free_gpu_memory_fraction: 0.9
      speculative_config:
        decoding_type: DSpark
        speculative_model_dir: /models/deepseek-v4-flash/worker
        max_draft_len: 5
        block_size: 5
        markov_rank: 256
        markov_head_type: vanilla
        mask_token_id: 128799
        target_layer_ids: [40, 41, 42]
        allow_advanced_sampling: true
weights:
  # Public, ungated checkpoint (MIT); no auth secret. The deployed listing referenced a
  # workspace-specific secret that does not exist in the registry deploy account.
  - source: hf://deepseek-ai/DeepSeek-V4-Flash-0731@7872f01b1d1fe23eabc4c98b48bffcef5a386062
    mount_location: /models/deepseek-v4-flash
