# Public, ungated checkpoint: no Hugging Face secret is required.
model_name: "model:ling-3.1-flash preset:latency"

model_metadata:
  description: >-
    Ling 3.1 Flash public hybrid MLA/KDA mixture-of-experts model,
    served with serialized block-FP8 weights and BF16 compute on eight B200
    GPUs using TP8 plus expert parallelism and native three-token MTP
    speculative decoding. Includes Ling 3 reasoning and
    automatic tool calling with a configured 262,144-token context limit.
  repo_id: inclusionAI/Ling-3.1-flash
  tags:
    - openai-compatible
  example_model_input:
    model: inclusionAI/Ling-3.1-flash
    messages:
      - role: user
        content: "What is 15% of 240?"
    stream: true
    max_tokens: 512
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    chat_template_kwargs:
      enable_thinking: false

base_image:
  image: "vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90"

# vLLM 0.30.0 cannot allocate the quantized 64-row MTP gate at TP8.
# The guarded shim restores only that draft gate to BF16 from its FP8 scales.
build_commands:
  - python3 /packages/patch_ling_mtp_gate.py

weights:
  # Public release config excludes narrow attention gates from block FP8.
  # The EA revision lacked these exclusions and failed TP8 initialization.
  - source: "hf://inclusionAI/Ling-3.1-flash@7b864daa2cedb1404e12bc52899def2d151a9719"
    mount_location: "/app/checkpoint/model"

environment_variables:
  VLLM_LOGGING_LEVEL: INFO
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"

docker_server:
  start_command: >-
    vllm serve /app/checkpoint/model
    --host 0.0.0.0
    --port 8000
    --served-model-name inclusionAI/Ling-3.1-flash
    --max-model-len 262144
    --trust-remote-code
    --dtype bfloat16
    --tensor-parallel-size 8
    --enable-expert-parallel
    --moe-backend triton
    --gpu-memory-utilization 0.9
    --enable-chunked-prefill
    --compilation-config.cudagraph_mode FULL_AND_PIECEWISE
    --enable-prefix-caching
    --mamba-cache-mode align
    --speculative-config.method mtp
    --speculative-config.num_speculative_tokens 3
    --enable-auto-tool-choice
    --tool-call-parser ling3
    --reasoning-parser ling3
    --load-format runai_streamer
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000

resources:
  instance_type: "B200:8"

runtime:
  predict_concurrency: 32
  health_checks:
    # Baseten caps the startup probe window at 3000 seconds (50 minutes).
    startup_threshold_seconds: 3000
    restart_threshold_seconds: 1200
    stop_traffic_threshold_seconds: 120
