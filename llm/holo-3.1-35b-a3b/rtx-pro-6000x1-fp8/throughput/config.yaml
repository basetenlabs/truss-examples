# BIS-LLM (vLLM backend) conversion of this preset, in place: same path, new deployment model
# `preset:bis-throughput` because the platform rejects BIS deployments into the old KNATIVE model.
# Kept from the vLLM docker_server preset: same checkpoint and revision, 262,144 context, 512 sequences, 32,768 batched tokens, 0.95 GPU memory, up to 2 images per prompt, qwen3 reasoning and qwen3_coder tool parsers.
#
# Serving image: the 2026-11-02 MP release (baseten/bis-llm-vllm:mp-v2026.11.02), pinned by its
# green tag. No bis_llm.version: the platform's current chart is used.
#
# Differences from the vLLM preset:
# - Qwen3.5 hybrid GDN settings from llm/qwen3.5-9b-bis: --mamba-cache-mode align,
#   --gdn-prefill-backend triton, DYN_KV_EVENT_MAIN_GROUP_IDX 3 (KV events from the
#   full-attention group), capped worker thread pools.
# - Images are planned by the BIS frontend and encoded by the worker (frontend_plan_worker_exec);
#   video is off. family: qwen35 is set explicitly: the encoder only resolves known Qwen repo
#   names, and an alias (e.g. Hcompany/Holo-3.1) otherwise fails with "Unknown encoder model".
model_name: model:holo-3.1-35b-a3b preset:bis-throughput
model_metadata:
  description: Holo-3.1-35B-A3B (FP8), H Company's computer-use / GUI-agent vision-language model on the
    Qwen3.6-35B-A3B MoE base, on one RTX PRO 6000 with image input (up to 2 per prompt) and native function
    calling, served with vLLM through the Baseten Inference Stack.
  repo_id: Hcompany/Holo-3.1-35B-A3B-FP8
  example_model_input:
    model: Hcompany/Holo-3.1-35B-A3B-FP8
    messages:
    - role: user
      content:
      - type: text
        text: Describe this image in one sentence.
      - type: image_url
        image_url:
          url: https://picsum.photos/id/237/200/300
    stream: true
    max_tokens: 512
    temperature: 1.0
  tags:
  - openai-compatible
  - vllm
  - holo3.1
  - fp8
  - h100
  - multimodal
bis_llm:
  config:
    additional_environment_variables:
      Worker:
        DYN_KV_EVENT_MAIN_GROUP_IDX: '3'
        HF_HUB_ENABLE_HF_TRANSFER: '1'
        MKL_NUM_THREADS: '4'
        OMP_NUM_THREADS: '1'
        RAYON_NUM_THREADS: '4'
        SAFETENSORS_FAST_GPU: '1'
        TOKENIZERS_PARALLELISM: 'false'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_LOGGING_LEVEL: WARNING
        PYTORCH_ALLOC_CONF: expandable_segments:True
    arguments_as_json: true
    b10_routing_config:
      algo_selector: B10
      durable_kv_events: false
      enable_worker_tree: true
      router_cache_miss_weight: 0
      router_overlap_score_weight: 1000
      router_temperature: 0.001
    b10_vision_config:
      encoding_mode: frontend_plan_worker_exec
      enabled: true
      family: qwen35
      max_images: 2
      max_videos: 0
    checkpoint_name: Hcompany/Holo-3.1-35B-A3B-FP8
    engine_backend: vllm
    engine_config:
      dtype: auto
      enable_chunked_prefill: true
      enable_prefix_caching: true
      enforce_eager: false
      gpu_memory_utilization: 0.95
      kv_events_endpoint: tcp://*:5557
      max_model_len: 262144
      max_num_batched_tokens: 32768
      max_num_seqs: 512
      trust_remote_code: true
      vllm_extra_args:
      - --mamba-cache-mode
      - align
      - --reasoning-parser
      - qwen3
      - --gdn-prefill-backend
      - triton
      - --limit-mm-per-prompt
      - '{"image": 2, "video": 0}'
    gpuTRTImage: baseten/bis-llm-vllm:green-mp--v0.26.0-d9e38b3e4-b6573aaba5
    language_model_only: false
    model_name: Hcompany/Holo-3.1-35B-A3B-FP8
    model_path: /models/holo-3.1-35b-a3b
    reasoning_parser: qwen3
    served_model_name: Hcompany/Holo-3.1-35B-A3B-FP8
    served_model_name_response: Hcompany/Holo-3.1-35B-A3B-FP8
    tensor_parallel_size: 1
    tokenizer_limit_length: 262144
    tool_call_parser: qwen3_coder
environment_variables: {}
resources:
  accelerator: RTX_PRO_6000
  use_gpu: true
weights:
- source: hf://Hcompany/Holo-3.1-35B-A3B-FP8@b4708750141b9f3f3bef42b87fdfe8bbe361c9b3
  mount_location: /models/holo-3.1-35b-a3b
