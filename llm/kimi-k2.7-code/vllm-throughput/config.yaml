model_name: "model:kimi-k2.7-code preset:vllm-throughput"

model_metadata:
  description: >-
    Kimi K2.7 Code served from NVIDIA's public NVFP4 checkpoint with vLLM on
    eight B200 GPUs. Supports text, image, and video inputs, reasoning, and
    automatic tool calling without customer-provided model-download secrets.
  repo_id: nvidia/Kimi-K2.7-Code-NVFP4
  tags:
    - openai-compatible
    - multimodal
    - nvfp4
    - public-huggingface
  example_model_input:
    model: moonshotai/Kimi-K2.7-Code
    messages:
      - role: user
        content: "Write a Python function that merges overlapping intervals."
    stream: true
    max_tokens: 1024
    temperature: 1.0
    top_p: 0.95

base_image:
  image: vllm/vllm-openai:v0.28.0

weights:
  - source: "hf://nvidia/Kimi-K2.7-Code-NVFP4@9f28d60908c98034bb288e755566764eac77cc0d"
    mount_location: /app/checkpoint/model
    allow_patterns:
      - "*.safetensors"
      - "*.json"
      - "*.py"
      - "*.jinja"
      - "*.txt"
      - "*.model"

docker_server:
  start_command: >-
    vllm serve /app/checkpoint/model
    --host 0.0.0.0
    --port 8000
    --served-model-name moonshotai/Kimi-K2.7-Code
    --tensor-parallel-size 8
    --trust-remote-code
    --mm-encoder-tp-mode data
    --reasoning-parser kimi_k2
    --enable-auto-tool-choice
    --tool-call-parser kimi_k2
    --generation-config vllm
    --max-model-len 262144
    --max-num-seqs 64
    --max-num-batched-tokens 32768
    --gpu-memory-utilization 0.90
    --kv-cache-dtype fp8
    --enable-prefix-caching
    --enable-chunked-prefill
    --load-format runai_streamer
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000

environment_variables:
  HF_HUB_OFFLINE: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  VLLM_LOGGING_LEVEL: WARNING
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_USE_FLASHINFER_MOE_FP4: "1"
  VLLM_USE_FLASHINFER_MOE_FP8: "1"
  VLLM_FLASHINFER_MOE_BACKEND: throughput
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

resources:
  accelerator: B200:8
  use_gpu: true

runtime:
  predict_concurrency: 64
  streaming_read_timeout: 3600
  health_checks:
    startup_threshold_seconds: 3000
    restart_threshold_seconds: 1800
    stop_traffic_threshold_seconds: 600
