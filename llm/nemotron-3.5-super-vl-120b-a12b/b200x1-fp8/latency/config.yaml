model_name: "model:nemotron-3.5-super-vl-120b-a12b preset:latency"
model_metadata:
  description: >-
    NVIDIA Nemotron 3.5 Super VL 120B-A12B reasoning model (NVFP4), with image/video/text prompts
    and built-in MTP speculative decoding, served with vLLM.
  repo_id: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
  example_model_input:
    model: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    messages:
      - role: user
        content: "Hello, what can you do?"
    stream: true
    max_tokens: 512
    temperature: 1.0
    top_p: 0.95
  tags:
    - openai-compatible
# The card validates nightly vllm-project/vllm@2a02f6ef, but Docker Hub prunes nightly tags after a few
# weeks. v0.30.0 is the first release that contains that commit.
base_image:
  image: vllm/vllm-openai:v0.30.0
weights:
  - source: "hf://nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4@7d4bc747b6bdc2cff64c58d65da0d08dd9caa25c"
    mount_location: "/models/nemotron-3.5-super-vl"
docker_server:
  start_command: >-
    vllm serve /models/nemotron-3.5-super-vl
    --host 0.0.0.0
    --port 8000
    --served-model-name nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    --trust-remote-code
    --async-scheduling
    --max-model-len 262144
    --max-num-seqs 32
    --gpu-memory-utilization 0.85
    --mamba-ssm-cache-dtype float32
    --allowed-local-media-path /
    --limit-mm-per-prompt.image 1
    --limit-mm-per-prompt.video 1
    --video-pruning-rate 0.5
    --media-io-kwargs.video.fps 2
    --media-io-kwargs.video.num_frames 256
    --speculative-config.method mtp
    --speculative-config.num_speculative_tokens 3
    --enable-auto-tool-choice
    --tool-call-parser qwen3_coder
    --reasoning-parser nemotron_v3
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
environment_variables:
  VLLM_LOGGING_LEVEL: WARNING
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
resources:
  instance_type: B200
runtime:
  predict_concurrency: 32
  health_checks:
    startup_threshold_seconds: 3000
    restart_threshold_seconds: 1200
    stop_traffic_threshold_seconds: 120
