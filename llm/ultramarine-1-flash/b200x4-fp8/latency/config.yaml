model_name: model:ultramarine-1-flash preset:latency
model_metadata:
  description: >-
    Ultramarine 1 Flash (Paper Instruments' fine-tune of GLM-5.3-Flash, FP8) on four B200s with
    SGLang, using Paper Instruments' recommended serving command: EAGLE speculative decoding on the
    model's built-in MTP layer and a 262,144-token context.
  repo_id: paperinstruments/Ultramarine-1-Flash
  tags: [openai-compatible]
  example_model_input:
    model: paperinstruments/Ultramarine-1-Flash
    messages: [{role: user, content: "Write FizzBuzz in Python."}]
    stream: true
    max_tokens: 4096
    temperature: 1.0
    top_p: 0.95

base_image:
  image: lmsysorg/sglang:v0.5.22@sha256:e3a4f06001a29542fc4a8638536d9ffc5eb9c9942b08603c09b19a56eae4a1ae

weights:
  - source: "hf://paperinstruments/Ultramarine-1-Flash@4dd4031735f044b7cdd050b66a15d6ee4e259111"
    mount_location: /models/ultramarine-1-flash
    auth_secret_name: hf_access_token

secrets:
  hf_access_token: null

docker_server:
  start_command: >-
    python3 -m sglang.launch_server
    --model-path /models/ultramarine-1-flash
    --served-model-name paperinstruments/Ultramarine-1-Flash
    --host 0.0.0.0
    --port 8000
    --tp-size 4
    --disable-shared-experts-fusion
    --context-length 262144
    --reasoning-parser glm45
    --tool-call-parser glm47
    --speculative-algorithm EAGLE
    --max-running-requests 48
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000

resources:
  accelerator: B200:4
  instance_type: B200:4
  use_gpu: true

runtime:
  predict_concurrency: 48
  streaming_read_timeout: 3600
  health_checks:
    startup_threshold_seconds: 2400
    restart_threshold_seconds: 900
    stop_traffic_threshold_seconds: 120

environment_variables:
  HF_HUB_OFFLINE: "1"
