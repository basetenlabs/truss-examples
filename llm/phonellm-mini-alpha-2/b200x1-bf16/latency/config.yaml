model_name: model:phonellm-mini-alpha-2 preset:latency
model_metadata:
  description: PhoneLLM Mini Alpha 2, text-only. DRAFT for the Model Scout phonellm-alpha-2 study.
    Served via SGLang v0.5.21 on 1x B200 (TP1). BF16 checkpoint, native 256K context, thinking off by default,
    qwen3_coder tool calls.
  repo_id: pipecat-ai/phonellm-mini-alpha-2
  example_model_input:
    model: pipecat-ai/phonellm-mini-alpha-2
    messages:
    - role: system
      content: You are a helpful voice assistant answering a phone call. Keep replies short and speakable.
    - role: user
      content: Hi, I'd like to move my appointment to next Tuesday.
    stream: true
    max_tokens: 512
    temperature: 0
    chat_template_kwargs:
      enable_thinking: false
  tags:
  - openai-compatible
base_image:
  # Docker Hub 2026-10-01, amd64+arm64, build commit e00930c (sglang v0.5.21).
  image: lmsysorg/sglang:v0.5.21-cu130
  python_executable_path: /opt/sglang/bin/python
weights:
  # Final release repo, pinned to main of pipecat-ai/phonellm-mini-alpha-2 on 2026-10-15
  # Downloaded anonymously; the pinned revision must be public.
  - source: "hf://pipecat-ai/phonellm-mini-alpha-2@4218fdc917a3a56340bf49de7b906637e131d9c1"
    mount_location: "/app/checkpoint/model"
docker_server:
  # Serving contract (study.json): BF16, max len = checkpoint native 262144 (no --context-length; the published benchmarks ran with a 32768 cap), thinking OFF by default (enable_thinking false) with no
  # reasoning parser,
  # qwen3_coder auto tool choice, 128 in-flight sequences, fp32 Mamba SSM state.
  # --tokenizer-worker-num 4: four tokenizer-manager/HTTP workers. MINI-SGLANG-D1 showed engine TTFT minus
  # queue+prefill_forward growing 233 -> 445 ms from c=32 to c=44 with queue ~0.6 ms and 99.3% radix hits.
  # H5: 8 workers (H4 medians: capacity 80, c=96 share 0.873).
  start_command: >-
    /opt/sglang/bin/python /packages/start_sglang.py
    --model-path /app/checkpoint/model
    --served-model-name pipecat-ai/phonellm-mini-alpha-2
    --trust-remote-code
    --tp-size 1
    --max-running-requests 128
    --mem-fraction-static 0.85
    --mamba-ssm-dtype float32
    --tool-call-parser qwen3_coder
    --tokenizer-worker-num 8
    --enable-metrics
    --bucket-time-to-first-token 0.05 0.1 0.15 0.2 0.25 0.3 0.35 0.4 0.45 0.5 0.55 0.6 0.65 0.7 0.75 0.8 0.85 0.9 0.95 1.0 1.05 1.1 1.15 1.2 1.25 1.3 1.35 1.4 1.45 1.5 2.0 3.0 5.0 10.0 20.0 40.0
    --log-level warning
    --host 0.0.0.0
    --port 8000
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
resources:
  accelerator: B200
  use_gpu: true
runtime:
  predict_concurrency: 128
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 1200
    stop_traffic_threshold_seconds: 120
