# BIS-LLM (vLLM backend) conversion of this preset, in place: same path, new deployment model
# `preset:bis-throughput` because the platform rejects BIS deployments into the old KNATIVE model.
# Kept from the vLLM docker_server preset: same checkpoint, 262,144 context, 512 sequences, 32,768 batched tokens, 0.95 GPU memory, FlashInfer MoE env, MTP speculative decoding (3 tokens), image input, qwen3 reasoning and qwen3_coder tool parsers.
#
# Serving image: the 2026-11-02 MP release (baseten/bis-llm-vllm:mp-v2026.11.02), pinned by its
# green tag. No bis_llm.version: the platform's current chart is used.
#
# Differences from the vLLM preset:
# - Qwen3.5 hybrid GDN settings from llm/qwen3.5-9b-bis: --mamba-cache-mode align,
#   --gdn-prefill-backend triton, DYN_KV_EVENT_MAIN_GROUP_IDX 3 (KV events from the
#   full-attention group), capped worker thread pools.
# - Images are planned by the BIS frontend and encoded by the worker (frontend_plan_worker_exec);
#   video is off. family: qwen35 is set explicitly: the encoder only resolves known Qwen repo
#   names, and an alias (e.g. Hcompany/Holo-3.1) otherwise fails with "Unknown encoder model".
# - Speculative decoding passed to vLLM as --speculative-config {"method": "qwen3_5_mtp", "num_speculative_tokens": 3}.
# - --moe_backend flashinfer_cutlass dropped: the BIS image runs vLLM v0.26 (the preset used v0.28); the FlashInfer MoE environment variables are kept.
# - Weights pinned to the revision in variant.json (the vLLM preset used @main).
model_name: model:qwen3.6-35b-a3b preset:bis-throughput
model_metadata:
  example_model_input:
    model: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    messages:
    - role: user
      content: What is the capital of France?
    max_tokens: 100
    temperature: 0.7
  tags:
  - openai-compatible
  - vllm
  - qwen3.6
  - nvfp4
  - b200
  description: Qwen 3.6 35B A3B MoE (RedHatAI NVFP4) throughput on one B200 with MTP speculative decoding,
    image input and Qwen tool calling, served with vLLM through the Baseten Inference Stack.
  repo_id: RedHatAI/Qwen3.6-35B-A3B-NVFP4
bis_llm:
  config:
    additional_environment_variables:
      Worker:
        DYN_KV_EVENT_MAIN_GROUP_IDX: '3'
        HF_HUB_ENABLE_HF_TRANSFER: '1'
        MKL_NUM_THREADS: '4'
        OMP_NUM_THREADS: '1'
        RAYON_NUM_THREADS: '4'
        SAFETENSORS_FAST_GPU: '1'
        TOKENIZERS_PARALLELISM: 'false'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_LOGGING_LEVEL: WARNING
        PYTORCH_ALLOC_CONF: expandable_segments:True
        VLLM_FLASHINFER_MOE_BACKEND: throughput
        VLLM_USE_FLASHINFER_MOE_FP4: '1'
        VLLM_USE_FLASHINFER_MOE_FP8: '1'
    arguments_as_json: true
    b10_routing_config:
      algo_selector: B10
      durable_kv_events: false
      enable_worker_tree: true
      router_cache_miss_weight: 0
      router_overlap_score_weight: 1000
      router_temperature: 0.001
    b10_vision_config:
      encoding_mode: frontend_plan_worker_exec
      enabled: true
      family: qwen35
      max_videos: 0
    checkpoint_name: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    engine_backend: vllm
    engine_config:
      dtype: auto
      enable_chunked_prefill: true
      enable_prefix_caching: true
      enforce_eager: false
      gpu_memory_utilization: 0.95
      kv_events_endpoint: tcp://*:5557
      max_model_len: 262144
      max_num_batched_tokens: 32768
      max_num_seqs: 512
      trust_remote_code: true
      vllm_extra_args:
      - --mamba-cache-mode
      - align
      - --reasoning-parser
      - qwen3
      - --gdn-prefill-backend
      - triton
      - --speculative-config
      - '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3}'
    gpuTRTImage: baseten/bis-llm-vllm:green-mp--v0.26.0-d9e38b3e4-b6573aaba5
    language_model_only: false
    model_name: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    model_path: /models/qwen3.6-35b-a3b-nvfp4
    reasoning_parser: qwen3
    served_model_name: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    served_model_name_response: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    tensor_parallel_size: 1
    tokenizer_limit_length: 262144
    tool_call_parser: qwen3_coder
environment_variables: {}
resources:
  accelerator: B200
  use_gpu: true
weights:
- source: hf://RedHatAI/Qwen3.6-35B-A3B-NVFP4@e94a930c8e9b8a7d3763e449289c261c9c7d3e5e
  mount_location: /models/qwen3.6-35b-a3b-nvfp4
  auth_secret_name: hf_access_token
