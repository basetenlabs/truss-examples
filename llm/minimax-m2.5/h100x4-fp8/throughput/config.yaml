# BIS-LLM (vLLM backend), converted in place from h100x4-fp8/throughput, the vLLM
# docker_server preset that served baseten/minimax-m2.5-throughput. Same checkpoint, same
# H100:4 with TP4 + expert parallel, same 64 sequences / 8,192 batched tokens.
# Deploys as a new model (preset:bis-throughput) because the platform rejects BIS deployments into
# the old preset's KNATIVE model; the listing switches with replace_model on merge.
#
# Differences from the vLLM preset:
# - Serving image: the 2026-11-02 MP release (baseten/bis-llm-vllm:mp-v2026.11.02), pinned by its
#   green tag. Platform-default chart (no bis_llm.version).
# - Weights pinned to the revision recorded in variant.json (the vLLM preset used @main).
# - max_model_len set explicitly to the checkpoint's 196,608 (the vLLM preset left it
#   at that default).
# - No reasoning_parser. The vLLM preset used minimax_m2_append_think, which keeps
#   <think> inline in content; leaving BIS reasoning parsing off preserves that output.
model_name: "model:minimax-m2.5 preset:bis-throughput"
model_metadata:
  description: >-
    MiniMax M2.5 (FP8) served with vLLM through the Baseten Inference Stack on four H100 GPUs
    with expert parallelism, MiniMax tool calling and auto tool choice.
  repo_id: MiniMaxAI/MiniMax-M2.5
  example_model_input:
    model: MiniMaxAI/MiniMax-M2.5
    messages:
      - role: system
        content: "You are a helpful assistant."
      - role: user
        content: "What is the meaning of life?"
    stream: true
    max_tokens: 32768
    temperature: 0.7
  tags:
    - openai-compatible
bis_llm:
  config:
    additional_environment_variables:
      Worker:
        HF_HUB_ENABLE_HF_TRANSFER: '1'
        OMP_NUM_THREADS: '1'
        SAFETENSORS_FAST_GPU: '1'
        VLLM_ENGINE_READY_TIMEOUT_S: '3600'
        VLLM_LOGGING_LEVEL: WARNING
    arguments_as_json: true
    b10_routing_config:
      algo_selector: B10
      durable_kv_events: false
      enable_worker_tree: true
      router_cache_miss_weight: 0
      router_overlap_score_weight: 1000
      router_temperature: 0.001
    checkpoint_name: MiniMaxAI/MiniMax-M2.5
    engine_backend: vllm
    engine_config:
      dtype: auto
      enable_chunked_prefill: true
      enable_prefix_caching: true
      enforce_eager: false
      kv_events_endpoint: tcp://*:5557
      max_model_len: 196608
      max_num_batched_tokens: 8192
      max_num_seqs: 64
      moe_expert_parallel_size: 4
      trust_remote_code: true
      vllm_extra_args:
      - --enable-expert-parallel
    gpuTRTImage: baseten/bis-llm-vllm:green-mp--v0.26.0-d9e38b3e4-b6573aaba5
    language_model_only: true
    model_name: MiniMaxAI/MiniMax-M2.5
    model_path: /models/minimax-m2.5
    served_model_name: MiniMaxAI/MiniMax-M2.5
    served_model_name_response: MiniMaxAI/MiniMax-M2.5
    tensor_parallel_size: 4
    tokenizer_limit_length: 196608
    tool_call_parser: minimax_m2
environment_variables: {}
resources:
  accelerator: H100:4
  use_gpu: true
weights:
  - source: hf://MiniMaxAI/MiniMax-M2.5@f710177d938eff80b684d42c5aa84b382612f21f
    mount_location: /models/minimax-m2.5
