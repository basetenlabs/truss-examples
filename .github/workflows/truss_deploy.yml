name: Droid deploy truss

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
        - main
    paths:
        - '**/model.py'

jobs:
    truss_test:
        if: ${{ github.triggering_actor == 'factory-droid' || github.triggering_actor == 'factory-droid[bot]'}}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0
              with:
                fetch-depth: 0

            - name: Set up Python
              uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5.6.0
              with:
                python-version: 3.11

            - name: Install dependencies (if any)
              run: |
                python -m pip install --upgrade pip
                pip install git+https://github.com/basetenlabs/truss.git requests tenacity --upgrade

            - name: Run tests
              env:
                BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
              run: python bin/test_truss_deploy.py
