name: Truss Examples CI

on:
  schedule:
    # Runs daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test-examples.yml
      - bin/test_example.py
      - ci.yaml

concurrency:
  group: test-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_tests:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.generate-matrix.outputs.tests }}

    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0
      - name: yq - portable yaml processor
        uses: chainguard-actions/mikefarah-yq@6a1e078deaa34c9fc0c3e1bb904faeb45e792cf6 # v4.54.2
      - name: Generate all tests that need to be run
        id: generate-matrix
        run: |
          TESTS=$(cat ci.yaml | yq e ".tests" | yq eval -o=json | jq -c .)
          echo "tests=$TESTS" >> $GITHUB_OUTPUT

  ci:
    # Forks get no secrets, so the tests can't deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs:
      - generate_tests
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        test: ${{ fromJSON(needs.generate_tests.outputs.tests) }}
    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0
      - name: Set up Python environment
        uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5.6.0
        with:
          python-version: '3.11.18'
      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/basetenlabs/truss.git requests tenacity --upgrade
      - name: Test => (${{ matrix.test }}
        run: |
          python ./bin/test_example.py ${{secrets.BASETEN_API_KEY}} ${{matrix.test}}
  report_to_slack:
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    needs:
      - ci
    steps:
      - name: get-branch
        run: echo ${{ github.ref }}
      - name: show-slack-status
        uses: chainguard-actions/8398a7-action-slack@f61be439726281ffef6ba03905e077117d05df89 # v3.19.0
        with:
          status: custom
          fields: author, job, commit, repo
          custom_payload: |
            {
              attachments: [{
                color: "${{ needs.ci.result == 'failure' && 'danger' || 'good' }}",
                text: `Truss Examples CI Result: ${{ needs.ci.result }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
