name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python/
      - run: poetry install
      - run: poetry run pre-commit run --all-files

  kai-adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Test Kai SystemOne adapter
        working-directory: vllm-sr/decision-1.0-kai-0.6b
        env:
          PYTHONPATH: .
        run: uv run --no-project --with-requirements tests/requirements.txt python -m pytest tests -q
