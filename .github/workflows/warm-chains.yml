name: Warm up chains examples

on:
  schedule:
    # Runs daily at 6am UTC
    - cron:  '*/20 * * * *'
  workflow_dispatch:

jobs:
  warm_chains:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0
      - name: Set up Python environment
        uses: chainguard-actions/actions-setup-python@c1869dcf3733fc23f862a7b6ebb625aba29b87e2 # v2.3.4
        with:
          python-version: '3.11.4'
      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          pip install truss --upgrade
      - name: Set up API Key
        run: |
          cat << EOF > ~/.trussrc
          [baseten]
          remote_provider = baseten
          api_key = ${{secrets.BASETEN_CHAINS_WARMER_API_KEY}}
          remote_url = https://app.baseten.co
          EOF
      - name: Warm up chains
        run: |
          truss chains deploy chains-examples/docs/poems/poems.py
          truss chains deploy chains-examples/docs/audio-transcription/whisper_chainlet.py
