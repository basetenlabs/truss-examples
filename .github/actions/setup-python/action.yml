name: "Setup Python"
description: "setups python, poetry and associated cache"


runs:
  using: "composite"
  steps:
    - uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5.6.0
      with:
        python-version: '3.11.18'

    - name: Get full Python version
      id: full-python-version
      shell: bash
      run: echo ::set-output name=version::$(python -c "import sys; print('-'.join(str(v) for v in sys.version_info))")

    - run: curl -sSL https://install.python-poetry.org | python3 -
      shell: bash

    - name: Configure poetry
      run: poetry config virtualenvs.in-project true
      shell: bash

    - name: Set up cache
      uses: chainguard-actions/actions-cache@1a492a110f951652a0d2d3327bc20ee36867788e # v4
      id: cache
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.full-python-version.outputs.version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Ensure cache is healthy
      if: steps.cache.outputs.cache-hit == 'true'
      run: timeout 10s poetry run pip --version || rm -rf .venv
      shell: bash
