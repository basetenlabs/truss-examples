model_name: model:elephant-1 preset:default
description: Text SystemOne decisions with baselabs/elephant-1.
resources:
  instance_type: H100
runtime:
  predict_concurrency: 32
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 10
    stop_traffic_threshold_seconds: 10
# Infinity v3 serves the OneJev decision protocol natively; the image runs unmodified.
base_image:
  image: ghcr.io/michaelfeil/infinity_v3:nvidia-3.0.0-alpha.9
environment_variables:
  INFINITY_BILLING_HEADERS: X-Baseten
weights:
- source: hf://baselabs/elephant-1@14537f08b0374edf9867ed0a4d2bd8df59e0400c
  mount_location: /models/elephant-1
  ignore_patterns:
  - '*.bin'
  - onnx/**
model_metadata:
  repo_id: baselabs/elephant-1
  example_model_input:
    model: elephant-1
    state: The parcel arrived damaged.
    questions:
      damaged:
        type: noul
        instructions: Is the parcel damaged?
docker_server:
  no_build: true
  start_command: >-
    /usr/local/bin/infinity_v3
    --model-id /models/elephant-1
    --served-model-name elephant-1
    --torch-device cuda
    --dtype bfloat16
    --decision-protocol onejev
    --hostname 0.0.0.0
    --port 8000
  server_port: 8000
  predict_endpoint: /v1/systemone
  readiness_endpoint: /health
  liveness_endpoint: /health
