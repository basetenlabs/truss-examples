model_name: model:clef-flash preset:default
description: Text SystemOne decisions with Cloudflare/clef-flash.
python_version: py311
requirements:
- fastapi==0.118.0
- uvicorn==0.37.0
- prometheus-client==0.21.1
- pydantic==2.13.5
- torch==2.8.0
- transformers==5.17.0
- safetensors==0.8.0
- accelerate==1.15.0
- torchvision==0.23.0
- pillow==11.3.0
resources:
  accelerator: H100:1
weights:
- source: hf://Cloudflare/clef-flash@8b2e5fd17c09fd49bc2880b805d5323ec7ff4ff3
  mount_location: /models/clef
  allow_patterns:
  - '*.json'
  - '*.safetensors'
  - '*.jinja'
  - LICENSE
  - joint_schema_model.py
environment_variables:
  HF_HUB_OFFLINE: '1'
  TOKENIZERS_PARALLELISM: 'false'
model_metadata:
  repo_id: Cloudflare/clef-flash
  example_model_input:
    model: clef-flash
    state: The parcel arrived damaged.
    questions:
      damaged:
        type: noul
        instructions: Is the parcel damaged?
docker_server:
  start_command: python3 -m uvicorn model.server:app --host 0.0.0.0 --port 8000 --app-dir
    /app
  server_port: 8000
  predict_endpoint: /predict
  readiness_endpoint: /health
  liveness_endpoint: /health
