model_name: "model:d3 preset:default"
description: >-
  A SystemOne HTTP server for text, image and video typed decisions with d3.
  Returns probabilities for Choice, Noul and Score questions without generating text.
python_version: py311
requirements:
  - fastapi==0.118.0
  - uvicorn==0.37.0
  - prometheus-client==0.21.1
  - pydantic==2.13.5
  - torch==2.8.0
  - torchvision==0.23.0
  - transformers==5.17.0
  - safetensors==0.8.0
  - accelerate==1.15.0
  - pillow==11.3.0
  - opencv-python-headless==4.12.0.88
resources:
  accelerator: H100:1
weights:
  - source: hf://vllm-sr/d3@093cffbaa7be6f5dfe14252ae7e80c396c06dbd9
    mount_location: /models/d3
    allow_patterns:
      - MODEL_MANIFEST.json
      - LICENSE
      - NOTICE
      - README.md
      - assets/banner.png
      - assets/example-receipt.png
      - assets/example-video.mp4
      - assets/index-areas.png
      - assets/index-pareto.png
      - chat_template.jinja
      - config.json
      - d3_engine.py
      - d3_fast.py
      - d3_format.py
      - d3_kernels.py
      - d3_runtime.py
      - d3_server.py
      - decision_config.json
      - merges.txt
      - model-00001-of-00011.safetensors
      - model-00002-of-00011.safetensors
      - model-00003-of-00011.safetensors
      - model-00004-of-00011.safetensors
      - model-00005-of-00011.safetensors
      - model-00006-of-00011.safetensors
      - model-00007-of-00011.safetensors
      - model-00008-of-00011.safetensors
      - model-00009-of-00011.safetensors
      - model-00010-of-00011.safetensors
      - model-00011-of-00011.safetensors
      - model.safetensors.index.json
      - modeling_d3.py
      - pipeline_d3.py
      - preprocessor_config.json
      - readout.safetensors
      - requirements.txt
      - tokenizer.json
      - tokenizer_config.json
      - video_preprocessor_config.json
      - vocab.json
environment_variables:
  HF_HUB_OFFLINE: "1"
  TOKENIZERS_PARALLELISM: "false"
model_metadata:
  repo_id: vllm-sr/d3
  example_model_input:
    model: d3
    state: "The parcel arrived damaged. Please send a replacement today."
    questions:
      route:
        type: choice
        instructions: "Which team should handle this request?"
        criteria:
          delivery: "Damaged or missing parcels"
          billing: "Payments and invoices"
      urgent:
        type: noul
        instructions: "Does the customer request action today?"
docker_server:
  start_command: python3 -m uvicorn model.server:app --host 0.0.0.0 --port 8000 --app-dir /app
  server_port: 8000
  predict_endpoint: /predict
  readiness_endpoint: /health
  liveness_endpoint: /health
