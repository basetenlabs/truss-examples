model_name: Triton TensorRT-LLM Backend
description: NVIDIA Triton Inference Server with the TensorRT-LLM inflight batcher ensemble on Baseten (custom docker_server).

model_metadata:
  example_model_input:
    text_input: "What is machine learning?"
    max_tokens: 64
    bad_words: ""
    stop_words: ""
  tags:
    - triton
    - tensorrt-llm
    - text-generation
    - bdn
    - custom-server

base_image:
  image: nvcr.io/nvidia/tritonserver:24.07-trtllm-python-py3

docker_server:
  run_as_user_id: 1000
  start_command: bash /app/data/start-triton.sh
  server_port: 8000
  predict_endpoint: /v2/models/ensemble/generate
  readiness_endpoint: /v2/health/ready
  liveness_endpoint: /v2/health/live

environment_variables:
  ENGINE_DIR: /models/engine
  TOKENIZER_DIR: /models/tokenizer

# Replace YOUR_ORG/your-trtllm-engine-repo with a HuggingFace repo (or s3://) that
# contains a TensorRT-LLM engine built for your target GPU topology.
weights:
  - source: hf://YOUR_ORG/your-trtllm-engine-repo@main
    mount_location: /models/engine
    auth:
      auth_method: CUSTOM_SECRET
      auth_secret_name: hf_access_token
  - source: hf://meta-llama/Llama-3.1-8B-Instruct@main
    mount_location: /models/tokenizer
    auth:
      auth_method: CUSTOM_SECRET
      auth_secret_name: hf_access_token
    allow_patterns:
      - "tokenizer*"
      - "config.json"
      - "special_tokens_map.json"
      - "*.json"

resources:
  accelerator: A100
  use_gpu: true

runtime:
  predict_concurrency: 32
  health_checks:
    restart_threshold_seconds: 1200
    stop_traffic_threshold_seconds: 600

secrets:
  hf_access_token: null

requirements: []
system_packages: []
external_package_dirs: []

build_commands:
  - chmod +x /app/data/start-triton.sh
