model_name: kimi3-encoder
description: Rust/C++ LibTorch vision encoder for moonshotai/Kimi-K3 with two GPU workers.

model_metadata:
  example_model_input:
    type: image_url
    image_url:
      url: "https://httpbin.org/image/png"
    model: moonshotai/Kimi-K3
    allow_bytes_without_b64: true

base_image:
  image: docker.io/baseten/dynamo-mm-encoder:libtorch-encoderf777f67172-cuda13compat

environment_variables:
  NVIDIA_DISABLE_REQUIRE: "true"
  LD_LIBRARY_PATH: /opt/mm-libtorch/lib

docker_server:
  no_build: true
  start_command: >-
    /opt/mm-libtorch/bin/mm-libtorch-encoder
    /models/kimi-k3
    moonshotai/Kimi-K3
    0.0.0.0:8000
    kimi
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /generate
  server_port: 8000

resources:
  accelerator: "RTX_PRO_6000:2"
  cpu: "8"
  memory: 16Gi

weights:
  - source: "hf://moonshotai/Kimi-K3"
    mount_location: "/models/kimi-k3"
    auth_secret_name: hf_access_token
    allow_patterns:
      - "*.json"
      - "model-00095-of-000096.safetensors"
      - "model-00096-of-000096.safetensors"

runtime:
  health_checks:
    restart_check_delay_seconds: 300
    restart_threshold_seconds: 30
    stop_traffic_threshold_seconds: 30
  predict_concurrency: 16
